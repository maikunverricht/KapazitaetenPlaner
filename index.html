        {id:"D-09",p:"M",t:"Nicht-Funk",r:"Der Ueberlast-Zuschlag von capEnd rechnet Stunden ueber die Tageskapazitaet in Arbeitstage um. Ein Stundenwert darf nie unmittelbar als Tagesanzahl weiterverwendet werden -- ueber die Abhaengigkeitskette multipliziert sich ein solcher Fehler.",v:"Math.ceil(totalExcess/cap)",tc:"BC-P-1..4 [Auto]"},
        {id:"D-10",p:"M",t:"Nicht-Funk",r:"Kalenderdaten werden als lokale Mitternacht gelesen (localDay), nie ueber new Date(\"YYYY-MM-DD\"), das UTC liest. Sonst verliert jede Schleife ueber das Sommerzeit-Ende ihren letzten Tag.",v:"Fr 23.10.2026 -> Mo 26.10. = 1 AT; getDays 12.-30.10. = 19 Tage",tc:"V3-DS-1/2 [Auto]"},
        {id:"D-11",p:"M",t:"Funk",r:"Die Analyse (capEnd, Ampel, Termin-Radar, Umplanungsstatus) rechnet mit derselben Abwesenheitskarte wie alle uebrigen Stellen: gemeldete Abwesenheiten, Feiertage und Ausfaelle des aktiven Szenarios. Was-waere-wenn vergleicht auf derselben Karte.",v:"runAnalysis(releases,employees,absences,absenceMap)",tc:"V3-AN-1..4 [Auto]"},
        {id:"D-12",p:"M",t:"Funk",r:"Beim Nachziehen von Nachfolgern (propagateDependencies) gilt die Tageskapazitaet des jeweiligen Mitarbeiters, nicht pauschal 8 h.",v:"56 h bei 35 h/Woche = 8 AT",tc:"V3-PD-1 [Auto]"},
      ]},
      {id:"V",title:"4. Ansichten & Visualisierung",col:A.mint,items:[
        {id:"V-01",p:"M",t:"Funk",r:"Auslastungsansicht: MA-Header klickbar. Bei aufgeklappt: BC/FC-Hierarchie sichtbar. Default: eingeklappt.",v:"exEmp[emp.id]===true für aufgeklappt",tc:"V-01/02/03, V-06 [Auto/Manuell]"},
        {id:"V-02",p:"M",t:"Funk",r:"Release-Ansicht: BC → FC → Pakete Hierarchie. Default: alle eingeklappt.",v:"exR/exC je ===true für aufgeklappt",tc:"V-07/08/09 [Manuell]"},
        {id:"V-03",p:"M",t:"Funk",r:"Gantt-Balken klickbar → EditPkgModal öffnet. EditPkgModal als Top-Level-Komponente (nicht nested).",v:"EditPkgModal vor Planungstool() definiert",tc:"B-01 [Auto]"},
        {id:"V-04",p:"M",t:"Funk",r:"Datumsbereich-Leiste über der Timeline (sticky): Schnellwahl Woche/Monat/Quartal/Halbjahr/Jahr/Alles + Von/Bis-Picker.",v:"Zeitraum-Leiste vorhanden. Sidebar-Dopplung entfernt (v2.17.6).",tc:"V-09 [Auto]"},
        {id:"V-05",p:"M",t:"Funk",r:"Gantt: Heute-Linie (mintfarben), Auslastungsbalken farbig (grün/amber/coral), Abwesenheitssymbole.",v:"Visuell erkennbar",tc:"V-10/11 [Manuell]"},
        {id:"V-06",p:"S",t:"Funk",r:"Simulationsmodus: Pakete mit berechneten Umplanungsdaten. Originaltermin gestrichelter Rahmen.",v:"simMode-Banner und scheduleAndBook vorhanden",tc:"V-22-C/D [Auto]"},
        {id:"V-07",p:"S",t:"Funk",r:"Abhängigkeitspfeile (DepArrows) als SVG-Overlay über dem Gantt. Stand v2.88.5: Die Komponente ist vorhanden, wird aber nirgends eingebunden -- die Pfeile erscheinen nicht. Einbinden oder entfernen ist offen.",v:"DepArrows-Komponente vorhanden",tc:"[Auto]"},
        {id:"V-08",p:"S",t:"Funk",r:"Umplanungsansicht: Analysekarten mit Empfehlungen, XLSX-Export mit 17+ Spalten.",v:"exportXlsx Spaltenköpfe korrekt",tc:"E-07-A-D [Auto]"},
        {id:"V-09",p:"S",t:"Funk",r:"Umplanung 'Überfällig': zeigt Workitems mit lcs≠started/closed, Start UND Ende in Vergangenheit. Vorschlag: frühester AT ≤80% Auslastung.",v:"ueberfaelligItems Berechnung vorhanden",tc:"[Manuell]"},
        {id:"V-10",p:"S",t:"Funk",r:"EditPkgModal: Start- und Enddatum per Date-Picker editierbar. updatePkgDates() aktualisiert State + propagateDependencies. Umplanungsvorschlag aus analysis wird angezeigt.",v:"updatePkgDates Funktion vorhanden; editStart/editEnd State im Modal",tc:"[Manuell]"},
        {id:"V-11",p:"S",t:"Funk",r:"Abhängigkeitspfeile (DepArrows): Farbe = Release-Farbe des Ziel-Pakets. Farbiger Marker-Pfeil pro Farbe. Durchgezogen (kein Strich).",v:"uniqueColors + farbige Marker in SVG defs",tc:"[Auto]"},
        {id:"V-12",p:"M",t:"Funk",r:"Kalenderwochen werden nach ISO 8601 beschriftet (Donnerstagsregel, isoWeek). kwNum ist nur noch ein Verweis darauf.",v:"12.10.2026 = KW 42; 29.12.2025 = KW 1",tc:"V3-KW-1 [Auto]"},
      ]},
      {id:"G",title:"5. Gantt-Darstellung",col:A.coral,items:[
        {id:"G-10",p:"M",t:"Funk",r:"Workitems lassen sich im Gantt waagerecht per Drag and Drop verschieben. Losgelassen wird nur der Start gesetzt; Ende, Abwesenheiten und Abhaengigkeiten rechnet updatePkgDates neu.",v:"movePkgTo -> updatePkgDates",tc:"D-A-* [Auto]"},
        {id:"G-11",p:"M",t:"Funk",r:"Landet der neue Start auf einem Wochenende, rueckt er auf den naechsten Werktag.",v:"snapWorkday",tc:"D-C-1, D-F-4/5 [Auto]"},
        {id:"G-12",p:"M",t:"Funk",r:"Waehrend des Ziehens zeigen ein Etikett den Zieltermin samt Tagesversatz und ein gestrichelter Rahmen die alte Lage. Gespeichert wird erst beim Loslassen.",v:"data-drag-label",tc:"D-D-1..4 [Auto]"},
        {id:"G-13",p:"M",t:"Funk",r:"Nach dem Verschieben erscheint ein Hinweis mit Rueckgaengig, der Start und Ende exakt wiederherstellt und nach neun Sekunden von selbst verschwindet.",v:"undoMovePkg",tc:"D-B-1..3 [Auto]"},
        {id:"G-14",p:"M",t:"Funk",r:"Eine Bewegung unter drei Pixeln gilt als Klick und oeffnet die Bearbeitung, statt zu verschieben.",v:"dragMovedRef",tc:"D-C-2/3 [Auto]"},
        {id:"G-15",p:"M",t:"Annahme",r:"Ziehen ist im Simulationsmodus gesperrt: dort stehen berechnete statt gespeicherter Termine, ein Zug wuerde in den echten Plan schreiben.",v:"_canDrag=!_simMode",tc:"D-E-2/3 [Auto]"},
        {id:"G-16",p:"S",t:"Annahme",r:"Nur waagerechtes Verschieben. Die Zuordnung zu einem anderen Mitarbeiter bleibt der Umbuchen-Funktion vorbehalten.",v:"kein vertikales Ziehen",tc:"[Entfaellt]"},
        {id:"G-17",p:"M",t:"Funk",r:"Griffe an beiden Balkenenden aendern die Dauer. Aus der aufgezogenen Spanne werden die verfuegbaren Arbeitstage gezaehlt und mit der Tageskapazitaet multipliziert -- das Ergebnis landet in den Reststunden.",v:"workHoursInSpan -> resizePkgTo",tc:"D-G-*, D-H-*, D-J-5 [Auto]"},
        {id:"G-18",p:"M",t:"Annahme",r:"Nicht das Datum wird gesetzt, sondern die Reststunden. CAPLAN leitet das Ende aus Reststunden, Kapazitaet und Abwesenheiten ab; ein direkt gesetztes Datum wuerde beim naechsten Neuberechnen wieder verworfen.",v:"calcEndDate bleibt fuehrend",tc:"D-G-6 [Auto]"},
        {id:"G-19",p:"M",t:"Funk",r:"Der Balken beginnt und endet immer auf einem Werktag: das linke Ende rastet vorwaerts, das rechte rueckwaerts. Ueber das Wochenende hinweg braucht es einen weiteren Tag Zug.",v:"snapWorkday / snapWorkdayBack",tc:"D-G-3/7, D-J-6 [Auto]"},
        {id:"G-20",p:"S",t:"Funk",r:"Uebersteigen die Reststunden den Gesamtaufwand, waechst dieser mit. Beim Verkuerzen bleibt er stehen -- bereits geleistete Arbeit verschwindet nicht.",v:"hours=max(hours,rem)",tc:"D-G-5, D-H-2 [Auto]"},
        {id:"G-21",p:"M",t:"Funk",r:"Das Ende faellt nie vor den Start; mindestens ein Arbeitstag bleibt uebrig.",v:"Klemmung in onPointerUp",tc:"D-I-1/2 [Auto]"},
        {id:"G-22",p:"M",t:"Nicht-Funk",r:"Die Griffe bleiben waehrend eines laufenden Zugs montiert, auch wenn der Balken schmal wird -- sonst verschwaende das Element mitten in der Geste und pointerup ginge verloren.",v:"(vw>=26||dragging)",tc:"D-I-9 [Auto]"},
        {id:"G-23",p:"M",t:"Nicht-Funk",r:"Der waagerechte Scrollbalken ist sichtbar und greifbar: 12 Pixel hoch auf gefaerbter Bahn, dazu scrollbar-width fuer Firefox. Ein 6-Pixel-Balken auf durchsichtiger Bahn war vorhanden, aber unauffindbar.",v:"::-webkit-scrollbar height 12px",tc:"SC-A-1..4 [Auto]"},
        {id:"G-24",p:"M",t:"Nicht-Funk",r:"Jedes Flex-Element ueber #main-scroll traegt minWidth:0. Ohne diese Angabe schrumpft ein Flex-Element nicht unter seine Inhaltsbreite -- der Scrollcontainer waechst dann ueber das Fenster hinaus, statt zu scrollen.",v:"minWidth:0 auf Hauptzeile, Hauptbereich und Rahmen",tc:"SC-B-3..5 [Auto]"},
        {id:"G-25",p:"M",t:"Funk",r:"Der laufende Zug wird von window-Listenern getragen, nicht allein von setPointerCapture. Verlaesst der Zeiger den Balken -- bei schmalen Balken sofort -- laufen Vorschau und Loslassen weiter.",v:"dragRef/dragEndRef + window pointermove/pointerup",tc:"SC-D-1..3 [Auto]"},
        {id:"G-26",p:"S",t:"Funk",r:"Ein Zug auf freier Flaeche verschiebt den Ausschnitt. Balken, Griffe, Knoepfe und Eingaben sind ausgenommen, damit Verschieben und Aufklappen sich nicht ins Gehege kommen. Erst ab vier Pixeln gilt es als Zug, danach zaehlt es nicht mehr als Klick.",v:"pointerdown auf #main-scroll, SKIP-Selektor",tc:"SC-C-1..4 [Auto]"},
        {id:"G-27",p:"M",t:"Funk",r:"Rueckgaengig sichert eine vollstaendige Momentaufnahme und stellt Termine, Rest- und Gesamtstunden wieder her.",v:"snapPkg / undoMovePkg",tc:"D-I-7 [Auto]"},
        {id:"G-01",p:"M",t:"Funk",r:"Zoom-Modi: Woche (CW=90px) und Tag (CW=30px). Toggle in Sidebar.",v:"zoom State steuert CW",tc:"G-01 [Manuell]"},
        {id:"G-02",p:"M",t:"Funk",r:"GanttHeader sticky (zIndex:10), Datumsbereich-Leiste sticky (zIndex:15), MA-Labels sticky (zIndex:8).",v:"position:sticky mit korrekten z-Indices",tc:"[Manuell]"},
        {id:"G-03",p:"S",t:"Funk",r:"Horizontales Scrolling im Gantt. Sidebar fix links, Gantt-Bereich scrollt.",v:"overflow-x:auto auf Gantt-Container",tc:"[Manuell]"},
        {id:"G-04",p:"S",t:"Funk",r:"Fortschrittsbalken: remainingHours/hours als Füllstand in Paket-Balken.",v:"Visuelle Darstellung remaining/total",tc:"V-13 [Manuell]"},
      ]},
      {id:"Z",title:"6. Zeiterfassung (Auftragstracker)",col:A.sky,items:[
        {id:"Z-01",p:"M",t:"Funk",r:"Gebucht wird ausschliesslich auf Workitems. Auftrag = BC, FC bleibt Zwischenebene; die Ebene Auftraggeber wird nicht abgebildet.",v:"timeWiIndex liefert {id,bc,fc}; kein Auftraggeber-Feld",tc:"Z-AST-1 [Auto]"},
        {id:"Z-02",p:"M",t:"Funk",r:"Schluessel einer Zeitbuchung ist die WI-ID (CQ-ID). BC/FC/Titel werden als Snapshot mitgeschrieben, damit Buchungen einen Re-Import ueberleben.",v:"entry.wiId + wiTitle/bc/fc gesetzt",tc:"E2E-16/18 [Auto]"},
        {id:"Z-03",p:"M",t:"Funk",r:"Timer laeuft als Segmentmodell: Pause schliesst das aktuelle Segment, Fortsetzen oeffnet ein neues. Pausen zaehlen nicht.",v:"activeElapsed summiert nur Segmente",tc:"Z-SEG-1..4, E2E-14/15 [Auto]"},
        {id:"Z-04",p:"M",t:"Funk",r:"Mitternachts-Ueberlauf: eine Buchung ueber die Tagesgrenze wird je Kalendertag aufgeteilt, verlustfrei in der Summe.",v:"splitAcrossMidnight",tc:"Z-MID-1..6 [Auto]"},
        {id:"Z-05",p:"M",t:"Funk",r:"Automatischer Auftragswechsel: beim Waehlen eines neuen Workitems wird der laufende Timer gestoppt, gebucht und der neue gestartet.",v:"timeStart bucht vor Neustart",tc:"Z-AST-13 [Auto]"},
        {id:"Z-06",p:"M",t:"Funk",r:"Der laufende Timer wird sofort in localStorage geschrieben und ueberlebt Reload und Tab-Wechsel.",v:"ptool_time_active nach jedem Setter",tc:"E2E-11/12 [Auto]"},
        {id:"Z-07",p:"M",t:"Funk",r:"Speicherung sekundengenau. Rundung (Exakt / 5 / 15 Min.) wirkt ausschliesslich im CSV-Export.",v:"roundSeconds nur in exportTimeCsv",tc:"Z-RND-1..7, Z-AST-12 [Auto]"},
        {id:"Z-08",p:"M",t:"Funk",r:"Manuelle Nachbuchung mit Datum, Von, Bis, Kommentar. Bis <= Von wird als Ueberlauf in den Folgetag interpretiert und aufgeteilt.",v:"saveTimeEdit + splitAcrossMidnight",tc:"[Manuell]"},
        {id:"Z-09",p:"S",t:"Funk",r:"Schnellauswahl per Strg+K mit Suche ueber WI-ID, Titel, BC und FC; Navigation per Pfeiltasten, Uebernahme per Enter, Schliessen per Esc.",v:"QuickSelect",tc:"E2E-09/10 [Auto]"},
        {id:"Z-10",p:"S",t:"Funk",r:"Geschlossene und stornierte Workitems erscheinen nicht in der aktiven Schnellauswahl.",v:"timeSearch filtert closed/canceled",tc:"Z-AST-11, E2E-10 [Auto]"},
        {id:"Z-11",p:"S",t:"Funk",r:"Kaskadierende Auswertung BC -> FC -> Workitem mit Soll/Ist und Budget-Ampel bei 80 % und 100 %.",v:"timeTree + SollIstBar",tc:"Z-REF-1/2 [Auto]"},
        {id:"Z-12",p:"S",t:"Funk",r:"Idle-Erkennung: bleibt die Eingabe laenger als die eingestellte Dauer aus, pausiert der Timer und ein Wiederkehr-Dialog bietet Verwerfen oder Behalten an.",v:"idleResolve schneidet Segment zurueck",tc:"[Manuell]"},
        {id:"Z-13",p:"M",t:"Annahme",r:"Stammdaten-Updates aus ClearQuest veraendern erfasste Zeitbuchungen niemals. Buchungen auf verschwundene Workitems bleiben unter '(nicht mehr im Import)' sichtbar.",v:"Orphan-Zweig in timeTree",tc:"E2E-17 [Auto]"},
        {id:"Z-14",p:"M",t:"Nicht-Funk",r:"Systemnahe Punkte des Lastenhefts entfallen im Browser: globale Hotkeys, Taskleisten-Widget, GetLastInputInfo, PowerModeChanged, Single-Instance-Mutex, MSIX, SQLite.",v:"Ersatz dokumentiert im Kopfkommentar",tc:"[Entfaellt]"},
        {id:"Z-15",p:"M",t:"Nicht-Funk",r:"Shortcuts weichen bewusst ab: Strg+P/S/N sind im Browser belegt und laufen auf Alt+P/S/N. Strg+K bleibt wie spezifiziert.",v:"Keydown-Handler",tc:"E2E-09/14/15/16 [Auto]"},
        {id:"Z-16",p:"M",t:"Nicht-Funk",r:"Rechtlicher Hinweis nach § 16 ArbZG ist in der Ansicht sichtbar: keine rechtskonforme Arbeitszeiterfassung.",v:"Fussnote in ZeitView",tc:"Z-AST-14, E2E-08 [Auto]"},
        {id:"Z-17",p:"S",t:"Funk",r:"Zeitbuchungen sind Teil des JSON-Backups und werden beim Import wiederhergestellt.",v:"exportJSON/importJSON",tc:"Z-AST-5 [Auto]"},
        {id:"Z-18",p:"S",t:"Nicht-Funk",r:"Der Sekundentakt der Live-Anzeige rendert nur die LiveTimer-Komponente, nicht den gesamten App-Baum.",v:"setInterval liegt in LiveTimer",tc:"Z-AST-10 [Auto]"},
        {id:"Z-19",p:"M",t:"Funk",r:"Gebucht wird unter dem kanonischen Namen des erkannten Mitarbeiters, nicht unter der beim Start eingetippten Schreibweise.",v:"timeUser -> selfEmp.name",tc:"ZT-B-1/ZT-C-1 [Auto]"},
        {id:"Z-20",p:"M",t:"Funk",r:"Jeder Vergleich von Buchungsnamen laeuft ueber sameEmpName, das beide Seiten zuerst ueber matchEmployeeByName aufloest. Damit zaehlen auch aeltere Buchungen unter abweichender Schreibweise weiter mit.",v:"canonName/sameEmpName statt !==",tc:"ZT-D-1 [Auto]"},
        {id:"Z-21",p:"S",t:"Funk",r:"Die Zeiterfassung zeigt Direktstart-Schaltflaechen: bis zu acht zuletzt gebuchte Workitems und alle aktiven Abrechnungsnummern. Ein Klick startet den Timer ohne Schnellauswahl.",v:"data-quickstart je Ziel",tc:"DS-A-1..5 [Auto]"},
        {id:"Z-22",p:"S",t:"Annahme",r:"Die Liste 'Zuletzt gebucht' entsteht aus den eigenen Buchungen, nicht aus einer gepflegten Merkliste. Abrechnungsnummern sind ausgenommen, weil sie eine eigene Gruppe haben.",v:"recentTargets ohne isAcct, hoechstens 8",tc:"DS-A-3/DS-A-4 [Auto]"},
        {id:"Z-23",p:"S",t:"Funk",r:"Workitems mit Startdatum heute stehen in der Schnellauswahl ohne Suchbegriff ganz oben und sind als 'startet heute' gekennzeichnet. Mit Suchbegriff bleibt die Trefferreihenfolge unangetastet.",v:"startsToday in tFilterWis",tc:"HT-A-1..4 [Auto]"},
        {id:"Z-24",p:"S",t:"Funk",r:"Der Direktstart fuehrt 'Startet heute' als erste Gruppe. Diese Ziele werden aus 'Zuletzt gebucht' herausgehalten, damit dieselbe Schaltflaeche nicht zweimal erscheint.",v:"todayTargets vor recentTargets",tc:"HT-B-1..3 [Auto]"},
        {id:"Z-25",p:"S",t:"Funk",r:"Der angezeigte Workitem-Titel laesst BC- und FC-Namen weg, weil beide bereits kleingedruckt darunter stehen. Entfernt wird nur ein ganzes Stueck an Trennern oder Rand; Namen unter drei Zeichen bleiben unangetastet.",v:"wiLabel an allen Anzeigestellen",tc:"TL-A-1..7 [Auto]"},
        {id:"Z-26",p:"M",t:"Annahme",r:"Die Kuerzung ist reine Anzeige. Gespeichert, exportiert und durchsucht wird weiterhin der Originaltitel -- sonst waeren Buchungen nach einer FC-Umbenennung nicht mehr wiederzufinden. Der volle Titel steht im Tooltip.",v:"keine Aenderung an timeExportRows/tFilterWis",tc:"TL-B-1..3 [Auto]"},
        {id:"Z-27",p:"S",t:"Funk",r:"Die Zeiterfassung ist in drei Reiter geteilt: Buchen (Timer, Direktstart, Kennzahlen), Meine Zeiten (Zeitraum, Soll/Ist, Buchungsliste), Auswertung (Monat, abrechenbare Stunden). Kein Block entfaellt.",v:"zeitTab steuert die Bloecke",tc:"ZT-T-1..7 [Auto]"},
        {id:"Z-28",p:"M",t:"Annahme",r:"Der gewaehlte Reiter wird unter ptool_zeit_tab gemerkt und ueberlebt Ansichtswechsel und Neustart. Voreinstellung ist Buchen, weil das die haeufigste Aufgabe ist.",v:"localStorage in setZeitTab",tc:"ZT-T-6 [Auto]"},
        {id:"P-01",p:"M",t:"Nicht-Funk",r:"Jeder gespeicherte Bestand wird beim Laden auf FORM geprueft, nicht nur auf null. Ein Zahlenwert, String oder Objekt anstelle einer Liste darf die Anwendung nicht zum Absturz bringen.",v:"safeList/safeMap an allen Kernschluesseln",tc:"PV-A-1..6 [Auto]"},
        {id:"P-02",p:"M",t:"Nicht-Funk",r:"Auch der INHALT einer Liste wird geprueft. Array.isArray allein laesst [null,null] durch; der Fehler faellt dann erst eine Ebene tiefer auf.",v:"Elementpruefung in safeList",tc:"PV-A-5 [Auto]"},
        {id:"P-03",p:"S",t:"Funk",r:"Teilweise beschaedigte Listen werden gerettet: gueltige Eintraege bleiben, verworfene werden gezaehlt und gemeldet. Vollstaendig unbrauchbare Bestaende werden geleert, NIEMALS still durch Demodaten ersetzt.",v:"DATA_ISSUES + Rueckfrage",tc:"PV-B-1..3 [Auto]"},
        {id:"F-26",p:"M",t:"Nicht-Funk",r:"In der Auslastung steht der Workitem-Titel immer allein in der ersten Zeile der Titelspalte, Beschreibung und Kennung darunter. Keine breitenabhaengige Umschaltung auf eine gemeinsame Zeile.",v:"GanttRow: flexDirection column ohne LW-Schwelle",tc:"UI-A-1..3 [Auto]"},
        {id:"F-27",p:"S",t:"Funk",r:"Die feste Spalte 'Bezeichnung' im Flow laesst sich wie jede andere Spalte in der Breite ziehen; Doppelklick stellt die Standardbreite her. Die Breite wird unter flowCols.labelW gemerkt.",v:"flowLabelResize + labelW",tc:"UI-B-1..3 [Auto]"},
        {id:"F-28",p:"M",t:"Funk",r:"Die Kopierschaltflaeche der Umplanung kopiert die Workitem-Kennung, nicht den BC-Namen.",v:"pkg.cqId||pkg.id",tc:"UI-C-1 [Auto]"},
        {id:"F-29",p:"M",t:"Nicht-Funk",r:"Die Fusszeile der Seitenleiste bleibt immer sichtbar. Die scrollbare Zone darueber traegt minHeight:0 -- ohne diese Angabe schrumpft ein Flex-Element nicht unter seine Inhaltshoehe und schiebt nachfolgende Elemente aus dem Rahmen.",v:"minHeight:0 + marginTop:auto",tc:"SB-A-1..4 [Auto]"},
        {id:"FL-01",p:"S",t:"Funk",r:"Der Flow bietet die Darstellung 'Karten': vier Spalten fuer die vier Ebenen, je Issue eine Karte, kein waagerechtes Scrollen. Die Tabelle bleibt unveraendert und Voreinstellung.",v:"ViewBoard neben ViewTeam/ViewTimeline",tc:"FB-A-1..6 [Auto]"},
        {id:"FL-02",p:"S",t:"Funk",r:"Die Karte beantwortet vier Fragen in fester Rangfolge: Deadline (Ampelrand und Verzugszeile), Arbeitsstand (Spalte), fehlende Zuordnung (Warnmarken), Restaufwand (Fusszeile).",v:"Kartenaufbau",tc:"FB-A-3..5 [Auto]"},
        {id:"FL-03",p:"M",t:"Funk",r:"Innerhalb einer Spalte stehen die Karten nach Dringlichkeit: rot, ueberfaellig, gelb, grau, gruen -- bei gleicher Ampel nach Groesse des Verzugs.",v:"RANG-Tabelle in ViewBoard",tc:"FB-A-6 [Auto]"},
        {id:"FL-04",p:"S",t:"Funk",r:"Der Flow zeigt auf Wunsch, welche Issue-Statuswerte vorkommen, wie oft und in welche Ebene sie fallen. Werte ohne eines der drei Kriterien sind eigens ausgewiesen.",v:"laneAudit + Anzeige",tc:"LA-A-1..6 [Auto]"},
        {id:"FL-05",p:"M",t:"Annahme",r:"Ebene 1 ist ein Auffangbecken, kein Kriterium. Ein umbenannter oder neuer LCS aus ClearQuest rutscht still dorthin; die Pruefung macht genau das sichtbar, statt es zu verbergen.",v:"auffang-Kennzeichnung",tc:"LA-A-4 [Auto]"},
        {id:"Z-37",p:"M",t:"Funk",r:"Monatsmodus als Voreinstellung: Blaettern per ◀/▶, Monatsauswahl und Sprung zum aktuellen Monat. Der Monat filtert Buchungsliste, Kennzahlen, Soll/Ist-Baum und Export.",v:"zMode/zMonth speisen zRange",tc:"M-E-1/2/9/10 [Auto]"},
        {id:"Z-38",p:"M",t:"Funk",r:"Soll-Stunden je Monat: Arbeitstage (Mo–Fr) x Tageskapazitaet aus der Wochenarbeitszeit, abzueglich erfasster Abwesenheiten.",v:"monthStat.sollAll",tc:"M-R-1..5, M-E-4 [Auto]"},
        {id:"Z-39",p:"M",t:"Funk",r:"Soll bis heute: nur Tage bis einschliesslich heute. Vergangene Monate ergeben das volle Monats-Soll, kuenftige Monate null.",v:"monthStat.sollMtd",tc:"M-R-6/7/8, M-E-11/12 [Auto]"},
        {id:"Z-40",p:"M",t:"Funk",r:"Differenz zwischen gebuchtem Ist und Soll bis heute wird farblich bewertet (im Plan, knapp darunter, deutlich darunter).",v:"Schwelle 0 % und -10 %",tc:"M-E-3 [Auto]"},
        {id:"Z-41",p:"M",t:"Funk",r:"Ein Mitarbeiter steuert die gesamte Zeiterfassung: Buchungsliste, Kennzahlen, Ist-Werte, Export und Monatsrechnung. Die Auswahl wird persistiert.",v:"timeCfg.empName",tc:"M-E-5/16/17 [Auto]"},
        {id:"Z-42",p:"M",t:"Annahme",r:"Gesetzliche Feiertage werden seit v2.71.0 aus dem Bundesland berechnet und vom Monats-Soll abgezogen (H-01, REP-02). Gemeindebezogene Feiertage werden als eigener Tag im Feiertagskalender ergaenzt.",v:"Fussnote der Monatsuebersicht",tc:"[Manuell]"},
        {id:"Z-32",p:"M",t:"Funk",r:"Eigene Abrechnungsnummern sind vollwertige Buchungsziele neben den CQ-Workitems: Schnellauswahl, Nachbuchung, Auswertung und Export.",v:"ACCT_PREFIX im Buchungsziel-Index",tc:"N-B-1..5 [Auto]"},
        {id:"Z-33",p:"M",t:"Funk",r:"Jede Nummer traegt ein Kennzeichen abrechenbar/intern. Kennungen sind pflicht und muessen eindeutig sein.",v:"Pruefung in AccountsOverlay",tc:"N-A-4/8/9 [Auto]"},
        {id:"Z-34",p:"M",t:"Annahme",r:"Das Kennzeichen wird beim Buchen in den Eintrag uebernommen. Die Auswertung liest den Schnappschuss, nicht die heutige Definition -- eine Umwidmung veraendert bereits erfasste Zeiten nicht.",v:"entry.billable",tc:"N-D-1/1b [Auto]"},
        {id:"Z-35",p:"M",t:"Funk",r:"Zeiten auf Abrechnungsnummern stehen in einem eigenen Abschnitt der Abrechnungskarte, getrennt nach abrechenbar und intern. Sie fliessen nicht in die Deckungsquote der geplanten Workitems ein.",v:"acctRows getrennt von rows",tc:"N-C-1..4 [Auto]"},
        {id:"Z-36",p:"S",t:"Funk",r:"Buchungen auf spaeter geloeschten Nummern bleiben erhalten und werden unter ihrer Nummer weiter ausgewiesen.",v:"Zweig fuer entfernte Nummern",tc:"N-D-2 [Auto]"},
        {id:"Z-43",p:"M",t:"Funk",r:"Abrechenbare Stunden je Monat: geplante Workitem-Stunden werden anteilig nach Arbeitstagen auf den Monat umgelegt und den darauf gebuchten Stunden gegenuebergestellt.",v:"monthBilling.billable vs. booked",tc:"B-S-1..5, B-E-5/6/9 [Auto]"},
        {id:"Z-44",p:"M",t:"Funk",r:"Je Workitem werden Plan gesamt, Anteil im Monat (mit Prozentangabe), gebuchte Stunden und Deckung ausgewiesen.",v:"Tabelle der Abrechnungskarte",tc:"B-E-5..8 [Auto]"},
        {id:"Z-45",p:"M",t:"Funk",r:"Stornierte Workitems sind nie abrechenbar. Workitems ohne Beruehrung des Monats erscheinen nicht; solche ohne Planungszeitraum nur mit ihren gebuchten Stunden.",v:"Filter in monthBilling",tc:"B-E-2/3 [Auto]"},
        {id:"Z-29",p:"M",t:"Funk",r:"Das Monats-Soll rechnet je Mitarbeiter mit dessen eigener Wochenarbeitszeit. 7 h/Tag gilt nur fuer eine 35-Stunden-Woche.",v:"dailyCapacity je Crew-Mitglied",tc:"B-C-1/3 [Auto]"},
        {id:"Z-30",p:"M",t:"Funk",r:"Bei 'Alle Mitarbeiter' wird das Soll ueber das Team summiert (Personentage), statt gar kein Soll auszuweisen. Die Spanne der Tageskapazitaeten wird erklaert.",v:"crew-Schleife in monthStat",tc:"B-C-2/4/5 [Auto]"},
        {id:"Z-31",p:"S",t:"Annahme",r:"Die anteilige Umlage nutzt reine Arbeitstage (Mo–Fr) ohne Abwesenheiten. Eine zweite Gewichtung waere kaum nachvollziehbar, da sich Workitems in CAPLAN bei Abwesenheit ohnehin verschieben.",v:"wdCountLocal",tc:"B-W-1..9 [Auto]"},
        {id:"Z-46",p:"M",t:"Nicht-Funk",r:"Komponenten mit Texteingabe liegen auf Modulebene. Innerhalb einer anderen Komponente definiert, bekaemen sie je Render eine neue Identitaet und die Eingabe verloere Cursorposition und Auswahl.",v:"QuickSelectOverlay/TimeEditOverlay modulweit",tc:"S-01..08 [Auto]"},
      ]},
      {id:"F",title:"7. Filter, Sidebar & Navigation",col:A.purple||A.violet,items:[
        {id:"F-01",p:"M",t:"Funk",r:"Navigations-Tabs: Dashboard, Auslastung, Kapazität, Releases, BC-Planung, Umplanung, Flow, Mitarbeiter, Zeiterfassung sowie die Info-Gruppe (Rohdaten, Architektur, Anforderungen, Testfälle).",v:"Alle Tabs erreichbar",tc:"[Manuell]"},
        {id:"F-02",p:"S",t:"Funk",r:"Releases/Mitarbeiter in Sidebar ein-/ausblendbar per Toggle.",v:"hiddenRel/hiddenEmp State",tc:"F-01/02/03 [Manuell]"},
        {id:"F-03",p:"S",t:"Funk",r:"Abteilungs-Kollaps in MA-Liste: alle Mitarbeiter einer Abteilung ein-/ausblendbar.",v:"deptKey+__collapsed",tc:"[Manuell]"},
        {id:"F-05",p:"M",t:"Funk",r:"Schalter 'Nur FC-Ebene' / 'Workitems sichtbar' in der Auslastung: aus -> nur FC-Zeilen mit kumulierten Aufwaenden, an -> FC-Zeilen aufklappbar mit den einzelnen Workitems.",v:"showWiLevel steuert Aufklappen und Sammelzeilen",tc:"F-A-*, F-B-*, F-C-* [Auto]"},
        {id:"F-06",p:"M",t:"Funk",r:"Die FC-Zeile kumuliert ausschliesslich die Workitems DIESES Mitarbeiters; geschlossene und fremde Workitems bleiben aussen vor.",v:"aggOf ueber fcPkgsForEmp",tc:"F-A-3/5, F-B-6/7 [Auto]"},
        {id:"F-07",p:"S",t:"Funk",r:"Workitems ohne FC (direkt am BC) erscheinen bei ausgeschalteter WI-Ebene als eine Sammelzeile 'Direkt am BC (ohne FC)'.",v:"data-agg-direct",tc:"F-A-6, F-B-3 [Auto]"},
        {id:"ACC-01",p:"M",t:"Funk",r:"Wird der eingegebene Name einem Mitarbeiter zugeordnet, zeigen die Ansichten nur dessen Daten: eigene Zeile in Auslastung und Matrix, eigene Workitems in der BC-Sicht, kein Bericht.",v:"visibleEmployees / ownPkgs",tc:"S-A-*, S-C-*, S-D-1 [Auto]"},
        {id:"ACC-10",p:"M",t:"Funk",r:"Gebucht wird nur auf EIGENE offene Workitems. Abrechnungsnummern bleiben immer buchbar -- sie gehoeren keinem Mitarbeiter. Ohne erkannten Namen stehen nur die Nummern zur Wahl.",v:"openWorkitems mit isAcct und selfEmp",tc:"Buchungsziele [Auto]"},
        {id:"ACC-08",p:"M",t:"Funk",r:"Der Sichtschutz gilt in JEDER Ansicht und jedem Menue: Umplanung (Liste und Karten), Filtermenue (Mitarbeiter und Teams), Szenario-Maske, Zeiterfassung und deren Mitarbeiterauswahl. Seit v2.88.3 auch die Dashboard-Kachel M5 und die globale Suche der Seitenleiste.",v:"visibleEmployees / canSeeAll an allen Listen",tc:"Leck-Suche [Auto]"},
        {id:"ACC-09",p:"M",t:"Funk",r:"Speist eine Ansicht sich aus mehreren Quellen, traegt JEDE Quelle den Sichtschutz. Die Kartenansicht der Umplanung liest aus analysis und aus allPkgs -- eine Pruefung allein an der ersten Quelle laesst die zweite offen.",v:"canSeeAll-Pruefung in beiden Schleifen",tc:"UM-A-1..3 [Auto]"},
        {id:"ACC-13",p:"S",t:"Funk",r:"Abrechnungsnummern tragen ein frei waehlbares Feld Gruppe. Leer heisst 'ohne Gruppe'. Die Vorschlagsliste speist sich aus den bereits vergebenen Werten.",v:"datalist acct-groups",tc:"AG-A-1..3 [Auto]"},
        {id:"ACC-11",p:"S",t:"Funk",r:"Die Gruppe bildet die BC-Ebene des Buchungsziels, das Kennzeichen abrechenbar/intern bleibt die FC-Ebene. Dadurch wirkt die Buendelung in Soll/Ist-Baum, Schnellauswahl und Export ohne Sonderweg.",v:"timeWiIndex bc/fc",tc:"AG-B-1..3 [Auto]"},
        {id:"ACC-12",p:"M",t:"Annahme",r:"Die Gruppe wird bei jeder Anzeige neu aufgeloest und NICHT in die Buchung kopiert. Eine Umbenennung ordnet auch alte Buchungen um, ohne erfasste Zeiten zu veraendern.",v:"acctGroupOf statt gespeichertem Feld",tc:"AG-C-1 [Auto]"},
        {id:"ACC-14",p:"M",t:"Nicht-Funk",r:"Eine automatisierte Leck-Suche rendert alle Ansichten und Menues im gesperrten Zustand und durchsucht das DOM nach Namen, Workitems und Abteilung eines fremden Mitarbeiters. Gegenprobe mit Freischaltung stellt sicher, dass die Suche nicht nur leere Seiten prueft.",v:"test_leaks",tc:"Leck-Suche [Auto]"},
        {id:"ACC-06",p:"M",t:"Funk",r:"NUR die erweiterte Ansicht oeffnet fremde Daten. Ohne erkannten Mitarbeiter bleiben personenbezogene Ansichten leer statt vollstaendig -- vorher hebelte ein Klick auf 'Ohne Namen fortfahren' den Schutz aus.",v:"canSeeAll=extView",tc:"S-A-4, S-G-1..6 [Auto]"},
        {id:"ACC-07",p:"S",t:"Funk",r:"Der leere Zustand wird erklaert: kein Name angegeben oder Name keinem Mitarbeiter zugeordnet, jeweils mit Weg zur Freischaltung.",v:"LockedHint",tc:"S-G-2/6 [Auto]"},
        {id:"ACC-02",p:"M",t:"Funk",r:"Der Code 1404 schaltet die erweiterte Ansicht frei. Sie wird NICHT gespeichert und bei jedem Start neu abgefragt.",v:"extView ohne Persistenz",tc:"S-B-1..5 [Auto]"},
        {id:"ACC-03",p:"M",t:"Annahme",r:"Das ist ein Sichtschutz gegen versehentliches Mitlesen, KEIN Zugriffsschutz. Der Code steht im Klartext in der Datei und muss es -- ohne Server gibt es niemanden, der pruefen koennte. Der Dialog benennt das ausdruecklich.",v:"EXT_CODE, Hinweistext",tc:"S-F-1/2 [Auto]"},
        {id:"ACC-04",p:"M",t:"Annahme",r:"Beschraenkt wird nur die DARSTELLUNG. Kapazitaetsrechnung, Umbuchung und Simulation nutzen weiterhin alle Mitarbeiter -- sonst waeren die Ergebnisse falsch.",v:"computeUmbuchung ohne visibleEmployees",tc:"S-F-3 [Auto]"},
        {id:"ACC-05",p:"S",t:"Funk",r:"Stammt der letzte Import nicht von heute, fragt die Anwendung nach der Anmeldung einmal nach neuen Daten. Ohne Anmeldung wird nicht gefragt.",v:"ptool_last_import",tc:"S-E-1..6 [Auto]"},
        {id:"REP-06",p:"S",t:"Funk",r:"Zeiten lassen sich als XLSX exportieren. CSV und XLSX kommen aus einer Quelle; im XLSX steht die Dauer als echte Zahl, im CSV mit deutschem Dezimalkomma.",v:"timeExportRows",tc:"X-A-*, X-B-* [Auto]"},
        {id:"REP-07",p:"S",t:"Funk",r:"Fehlt die XLSX-Bibliothek, erscheint ein Hinweis auf den CSV-Weg statt eines Absturzes.",v:"Pruefung auf XLSX.utils",tc:"X-A-7 [Auto]"},
        {id:"REP-08",p:"S",t:"Funk",r:"Dashboard-Kachel M13 zeigt die erfasste Zeit fuer heute, diese Woche und diesen Monat, getrennt nach abrechenbar und intern.",v:"Card M13",tc:"X-C-1..5 [Auto]"},
        {id:"REP-09",p:"S",t:"Funk",r:"Ein Klick auf eine Matrixzelle wechselt in den Zeitstrahl, setzt den Zeitraum auf die Woche und klappt den Mitarbeiter auf.",v:"data-matrix-cell",tc:"X-D-1..4 [Auto]"},
        {id:"REP-01",p:"M",t:"Funk",r:"Der Bericht fasst Kapazitaet, Abrechnung, Verlauf und Termine fuer einen Zeitraum auf einem Blatt zusammen. Monat oder Quartal waehlbar.",v:"ReportView",tc:"R-A-*, R-E-* [Auto]"},
        {id:"REP-02",p:"M",t:"Funk",r:"Soll je Mitarbeiter aus Arbeitstagen mal Tageskapazitaet, abzueglich Feiertagen und Abwesenheiten; Ist aus der Zeiterfassung. Beides mit Summenzeile.",v:"perEmp / tot",tc:"R-B-1..4 [Auto]"},
        {id:"REP-03",p:"M",t:"Funk",r:"Abrechnung trennt Workitem-Zeit, abrechenbare und interne Abrechnungsnummern und weist die abrechenbare Quote aus.",v:"bill",tc:"R-C-1..3 [Auto]"},
        {id:"REP-04",p:"S",t:"Funk",r:"PDF entsteht ueber den Druckdialog des Browsers. Bedienelemente und Kopfleiste sind per no-print ausgenommen, Bloecke gegen Seitenumbruch geschuetzt.",v:"@media print",tc:"R-F-1..4 [Auto]"},
        {id:"REP-05",p:"M",t:"Annahme",r:"Der Bericht vermerkt ein aktives Szenario und ein fehlendes Bundesland im Kopf.",v:"Warnzeilen",tc:"R-G-1 [Auto]"},
        {id:"VIS-01",p:"M",t:"Funk",r:"Szenarien sind benannt und bleiben erhalten. Sie halten fest, wer ausfaellt und welche BCs neu eingeplant werden.",v:"ptool_scenarios",tc:"V-B-1..6 [Auto]"},
        {id:"VIS-02",p:"M",t:"Funk",r:"Kennzahl ist der Terminverzug je BC: spaetestes Ende eines offenen Workitems gegen das BC-Datum. Geschlossene Workitems bleiben aussen vor.",v:"bcDelays",tc:"V-A-4 [Auto]"},
        {id:"VIS-03",p:"M",t:"Funk",r:"Alle Szenarien werden gerechnet, ohne sie zu aktivieren -- die Vergleichsansicht zeigt je BC den Verzug heute und im Szenario samt Differenz.",v:"computeUmbuchungWith / absMapForScenario",tc:"V-C-1..4 [Auto]"},
        {id:"VIS-04",p:"M",t:"Funk",r:"Ein angewendetes Szenario wirkt in der gesamten Anwendung und wird in der Titelzeile ausgewiesen.",v:"activeScen in absenceMap und activeReleases",tc:"V-D-*, V-E-* [Auto]"},
        {id:"VIS-05",p:"M",t:"Annahme",r:"Szenario-Ausfaelle ueberschreiben gemeldete Abwesenheiten -- ein Szenario beschreibt eine andere Welt, keine Ergaenzung.",v:"Reihenfolge in absenceMap",tc:"V-E-2 [Auto]"},
        {id:"VIS-06",p:"S",t:"Annahme",r:"Geaenderte Wochenarbeitszeiten sind bewusst NICHT im Modell: sie muessten an sechs Kapazitaetsstellen durchgereicht werden. Ein Ausfall laesst sich als Abwesenheit abbilden.",v:"kein hours-Feld",tc:"V-G-4 [Auto]"},
        {id:"H-01",p:"M",t:"Funk",r:"Gesetzliche Feiertage werden aus dem Bundesland berechnet (Gausssche Osterformel plus feste Termine) und wirken ueberall dort, wo Kapazitaet gerechnet wird.",v:"holidaysForYear / buildHolidayMap",tc:"H-A-*, H-B-*, H-C-* [Auto]"},
        {id:"H-02",p:"M",t:"Nicht-Funk",r:"Feiertage werden in die Abwesenheitskarte eingespeist statt an jeder Rechenstelle geprueft. Die Karte ist der eine Punkt, an dem calcEndDate, buildLoadMap, workHoursInSpan und das Monats-Soll bereits vorbeikommen.",v:"absenceMap mit Typ feiertag",tc:"H-E-3/4, H-H-2 [Auto]"},
        {id:"H-03",p:"M",t:"Annahme",r:"Eine gemeldete Abwesenheit am selben Tag hat Vorrang vor dem Feiertag, damit Urlaub nicht ueberschrieben wird. Feiertage sind kein waehlbarer Abwesenheitstyp.",v:"Reihenfolge im useMemo",tc:"H-H-3/4 [Auto]"},
        {id:"H-04",p:"S",t:"Funk",r:"Einzelne Tage lassen sich abwaehlen und eigene Tage ergaenzen (Betriebsruhe). Regional geteilte Faelle sind bewusst nicht abgebildet -- sie haengen an der Gemeinde, nicht am Bundesland.",v:"cfg.extra / cfg.removed",tc:"H-D-1/2, H-G-4 [Auto]"},
        {id:"H-05",p:"M",t:"Funk",r:"Ohne gewaehltes Bundesland bleibt das Verhalten wie zuvor, die Ansicht warnt aber sichtbar vor dem zu hohen Soll.",v:"Hinweis in der Monatsuebersicht",tc:"H-F-1/2/5 [Auto]"},
        {id:"S-01",p:"M",t:"Funk",r:"Die Suite besteht aus fuenf Modulen (zeit, kapa, releases, report, vision) plus einem Kern, der immer laeuft: Import, Mitarbeiter, Abwesenheiten, Backup, Filter, Dashboard.",v:"MODULES / VIEW_MODULE",tc:"M-G-1..3 [Auto]"},
        {id:"S-02",p:"M",t:"Funk",r:"Eine Auslieferungsvariante entsteht durch Aendern EINER Zeile (MODULES_ON). Navigation, Routing, Umschalter und Bedienelemente richten sich danach.",v:"modOn()",tc:"M-B-*, M-C-*, M-D-* [Auto]"},
        {id:"S-03",p:"M",t:"Funk",r:"Die Auslastung gehoert zwei Modulen: die Gruppierung nach Mitarbeiter zu kapa, die nach BC zu releases. Fehlt eines, entfaellt die jeweilige Schaltflaeche und die Gruppierung wechselt automatisch.",v:"Umschalter je modOn",tc:"M-C-3, M-D-2/3 [Auto]"},
        {id:"S-04",p:"M",t:"Annahme",r:"Steht die gespeicherte Ansicht in einem abgeschalteten Modul, faellt sie auf das Dashboard zurueck statt eine leere Seite zu zeigen.",v:"viewAllowed",tc:"M-E-1..3 [Auto]"},
        {id:"S-05",p:"S",t:"Nicht-Funk",r:"Kein Build-Schritt: der Code aller Module bleibt in der Datei. Das kostet Dateigroesse und schuetzt nicht vor Neugier, haelt aber die Ein-Datei-Auslieferung bei.",v:"MODULES_ON zur Laufzeit",tc:"[Entfaellt]"},
        {id:"F-24",p:"M",t:"Funk",r:"Der Umschalter der Auslastung trennt Dimension und Darstellung: links Mitarbeiter mit den Unterpunkten Gantt und Matrix, daneben BC.",v:"gruppierte Schaltflaechen",tc:"P-A-1..3 [Auto]"},
        {id:"F-25",p:"M",t:"Nicht-Funk",r:"In der Auslastung nach BC steht der Name allein in der ersten Zeile der Titelspalte, Termin und Abzeichen in einer zweiten. Ein Titel darf nicht mit festbreiten Nachbarn um dieselbe Zeile ringen -- der feste Anteil war breiter als die Spalte.",v:"flexDirection column in BC- und FC-Zeile",tc:"BL-A-1..4 [Auto]"},
        {id:"BC-A-1",p:"M",t:"Funk",r:"Verzug wird ueberall in ARBEITSTAGEN gemessen: die Ampel der BC-Planung, die Spalte Delta AT und die Dashboard-Kachel Groesste Verzuege nutzen denselben Helfer und dieselbe Schwelle (DEADLINE_BUFFER). Ein gelbes Licht heisst damit tatsaechlich hoechstens fuenf Arbeitstage Verzug, nicht fuenf Kalendertage.",v:"workdaysBetween2 statt Kalendertagsdifferenz, deltaAT ohne pauschalen Abzug",tc:"AM-1..16 [Auto]"},
        {id:"BC-A-2",p:"M",t:"Funk",r:"Auch Szenarien, Umplanung, Konflikt-Kaskaden, Was-waere-wenn und der Export messen Verzug in Arbeitstagen und beschriften ihn mit AT. Countdowns (\"in 5T\", \"10 Tage ueberfaellig\") bleiben bewusst Kalendertage und tragen \"T\" bzw. \"Tage\".",v:"workdaysBetween2 in bcDelays, daysLost, shiftDays, delta",tc:"V3-AT-1..3, V4-UE-1 [Auto]"},
        {id:"ACC-15",p:"M",t:"Funk",r:"Auch rechnende Ansichten unterliegen dem Sichtschutz: die Kapazitaetstabelle der BC-Planung, ihre Engpass-Spalte und der Bearbeiter des kritischen Workitems nennen ohne erweiterte Ansicht keine fremden Namen. Fremde Zeilen werden zu einer Sammelzeile verrechnet, damit Bedarf und Luecke richtig bleiben.",v:"computeCapacity maskiert, wenn canSeeAll false",tc:"LK-BCP-1..3 [Auto]"},
        {id:"R-04",p:"S",t:"Funk",r:"Jede BC-Zeile der Auslastung nach Mitarbeiter traegt einen Sprungpfeil in die Auslastung nach BC: Modus wechseln, BC aufklappen, Zeile anscrollen und kurz umranden. Der Zeilenklick bleibt Auf- und Zuklappen.",v:"jumpToBc + data-bc-row in ReleaseView",tc:"JB-A-1..4 [Auto]"},
        {id:"R-05",p:"S",t:"Funk",r:"Kennungen (BC, FC, Workitem) sind per Klick kopierbar -- in beiden Gruppierungen der Auslastung, BC-Planung, Dashboard, Zeiterfassung, Rohdaten und im Workitem-Fenster. Eine Komponente (CopyID), kein Nachbau je Ansicht.",v:"CopyID statt statischer Kennungs-Spans",tc:"JB-B-1..3 [Auto]"},
        {id:"R-02",p:"S",t:"Funk",r:"In der Auslastung nach BC lassen sich die Workitems je FC einzeln aufklappen, voreingestellt zu. v2.40.0 hatte sie entfernt, weil sie IMMER mitliefen -- der Klappzustand loest genau das.",v:"exC steuert die WI-Zeilen der ReleaseView",tc:"WI-A-1..5 [Auto]"},
        {id:"R-03",p:"M",t:"Funk",r:"Die Workitem-Zeilen der BC-Darstellung kommen aus GanttRow, derselben Komponente wie in der Darstellung nach Mitarbeiter. Ziehen, Tooltip und Simulationssperre verhalten sich dadurch identisch statt nachgebaut.",v:"GanttRow in ReleaseView",tc:"WI-A-4 [Auto]"},
        {id:"R-06",p:"M",t:"Funk",r:"Der Sichtschutz gilt fuer die neuen Workitem-Zeilen: sie stammen aus visiblePkgs, das bereits durch ownPkgs laeuft.",v:"ownPkgs vor der WI-Liste",tc:"WI-B-1 [Auto]"},
        {id:"F-32",p:"M",t:"Funk",r:"Filter liegen in einem Menue im Kopfbereich, nicht als Dauerlisten in der Seitenleiste. Es gliedert nach Mitarbeitern, Teams, BCs und BC-Versionen und zeigt die Zahl aktiver Filter.",v:"data-filter-panel",tc:"P-B-1..16 [Auto]"},
        {id:"F-33",p:"S",t:"Funk",r:"Das Filtermenue erscheint nur in Ansichten, in denen die Filter wirken (Auslastung, BC-Planung, Umplanung, Flow, Mitarbeiter).",v:"Sichtbarkeitsbedingung",tc:"P-C-* [Auto]"},
        {id:"F-34",p:"M",t:"Funk",r:"Der Zeitraum ist ebenfalls ein Menue mit Schnellwahl und freien Daten; der Knopf zeigt den gewaehlten Zeitraum an.",v:"data-range-panel",tc:"P-D-1..5 [Auto]"},
        {id:"F-35",p:"M",t:"Nicht-Funk",r:"Die Zahl aktiver Filter wird NACH den Zustaenden hiddenEmp/hiddenRel berechnet. Weiter oben waeren die var-Deklarationen undefined und die Abhaengigkeiten wuerden nie neu rechnen.",v:"Position von filterCount",tc:"P-B-16 [Auto]"},
        {id:"F-20",p:"M",t:"Funk",r:"Auch die Releases-Ansicht ist eine Gruppierung derselben Auslastungsansicht. Der Umschalter hat drei Zustaende: Mitarbeiter, BC, Matrix.",v:"auslMode ma/bc/matrix",tc:"K-F-1..7 [Auto]"},
        {id:"F-21",p:"M",t:"Annahme",r:"BC-Planung bleibt eigenstaendig. Sie parst Versionsnummern, gruppiert nach Produkt und bringt eigenen Zoom mit -- als vierter Zustand haette sie sich anders verhalten als die uebrigen drei.",v:"eigener Navigationseintrag",tc:"K-G-5/6 [Auto]"},
        {id:"F-22",p:"S",t:"Funk",r:"Die Navigation ist nach Zweck gruppiert: Dashboard, dann Planung (Auslastung, BC-Planung, Umplanung, Flow), dann Team & Zeit (Mitarbeiter, Zeiterfassung).",v:"navGroups",tc:"K-G-1..4 [Auto]"},
        {id:"F-23",p:"M",t:"Annahme",r:"Gespeicherte Staende mit 'releases' werden beim Start auf Auslastung + BC umgeschrieben; der alte Modusname 'gantt' wird auf 'ma' gehoben.",v:"Migration in useState und useEffect",tc:"K-F-8/9/10 [Auto]"},
        {id:"F-16",p:"M",t:"Funk",r:"Auslastung und Kapazitaet sind eine Ansicht mit zwei Darstellungen (Gantt / Matrix). Beide rechnen mit buildLoadMap und dailyCapacity; die Wahl wird unter ptool_ausl_mode gespeichert. Seit v2.88.3 lesen Zeitstrahl und Matrix dieselbe Karte aus allen Paketen der aktiven Releases: ein Filter blendet aus, er entlastet nicht.",v:"auslMode steuert das Routing",tc:"K-A-* [Auto]"},

      // Kennzeichen bleibt auf der FC-Ebene -- beide Ordnungen kreuzen sich,
      // statt einander zu verdraengen.
      var _g=String(a.group||"").trim();
      out.push({id:ACCT_PREFIX+a.number,title:a.label||a.number,
                bc:_g?("Abrechnung \u00b7 "+_g):"Abrechnungsnummern",
                fc:a.billable===false?"Intern":"Abrechenbar",
                lcs:"",hours:0,employee:null,start:"",end:"",
                color:a.billable===false?A.textLight:A.mint,
                isAcct:true,billable:a.billable!==false});
    });
    return out;
  },[releases,customColors,accounts]);

  // v2.84.0: Gruppe zu einem Buchungsziel. Bewusst LEBEND aufgeloest und
  // nicht in die Buchung kopiert -- sonst haette jede Umbenennung einen
  // Datenumbau noetig gemacht, und alte Buchungen blieben in der alten
  // Gruppe haengen.
  function acctGroupOf(wiId){
    if(!isAcctId(wiId))return "";
    var num=acctNumberOf(wiId);
    var a=(accounts||[]).filter(function(x){return x.number===num;})[0];
    return a?String(a.group||"").trim():"";
  }

  // Kennzeichen abrechenbar/intern zu einem Buchungsziel
  function acctBillableOf(wiId){
    if(!isAcctId(wiId))return null;
    var num=acctNumberOf(wiId);
    var a=(accounts||[]).filter(function(x){return x.number===num;})[0];
    return a?(a.billable!==false):true;
  }

  var timeWiById=useMemo(function(){
    var m={};timeWiIndex.forEach(function(w){m[w.id]=w;});return m;
  },[timeWiIndex]);

  // Buchungen im gewaehlten Zeitraum (leer = alles)
  // v2.58.0: Im Monatsmodus bestimmt der Monat den Filter, sonst der freie
  // Zeitraum. Beide Modi speisen dieselbe Auswertung.
  var zRange=useMemo(function(){
    if(zMode==="month"&&zMonth){
      var b=monthBounds(zMonth);
      return {from:dateStr(b.first),to:dateStr(b.last)};
    }
    return {from:zFrom,to:zTo};
  },[zMode,zMonth,zFrom,zTo]);



  // v2.58.0: EIN Mitarbeiter steuert die gesamte Zeiterfassung -- Buchungsliste,
  // Kennzahlen, Ist-Werte im Soll/Ist-Baum, Export und Monatsrechnung. Der Wert
  // "__all__" bedeutet ausdruecklich "alle Mitarbeiter".
  var timeEmp=useMemo(function(){
    // v2.75.2: Ohne Freischaltung bleibt die Auswertung immer beim eigenen
    // Namen, unabhaengig davon, was gespeichert war.
    if(!canSeeAll)return selfEmp;
    var n=timeCfg.empName;
    if(!n||n==="__all__")return null;
    return (employees||[]).filter(function(e){return e.name===n;})[0]||null;
  },[timeCfg,employees,canSeeAll,selfEmp]);

  // Beim ersten Aufruf den am Start eingegebenen Namen uebernehmen, sofern er
  // eindeutig einem Mitarbeiter entspricht. Eine ausdrueckliche Auswahl (auch
  // "__all__") wird nie ueberschrieben.
  useEffect(function(){
    if(timeCfg.empName)return;
    var m=matchEmployeeByName(dashUser,employees);
    if(m)setTimeCfg(Object.assign({},timeCfg,{empName:m.name}));
  },[dashUser,employees,timeCfg]);

  // ── v2.84.0: Namen aufloesen statt Zeichenketten vergleichen ──────
  // Gebucht wurde bisher unter dem eingetippten Namen, ausgewertet wurde
  // gegen den kanonischen Namen des Mitarbeiters -- mit striktem !==.
  // "anna" wird von matchEmployeeByName richtig erkannt, ist aber nicht
  // gleich "Anna Mueller", also fiel die Buchung aus jedem Filter heraus.
  // canonName loest beide Seiten ueber dieselbe Erkennung auf. Der Cache
  // haelt das billig: ohne ihn liefe jede Buchung bei jedem Rendern durch
  // die gesamte Mitarbeiterliste.
  var canonName=useMemo(function(){
    var cache={};
    return function(n){
      var k=String(n||"");
      if(!(k in cache)){
        var m=matchEmployeeByName(k,employees);
        cache[k]=m?m.name:k.trim();
      }
      return cache[k];
    };
  },[employees]);
  // Leerer Name auf einer Seite heisst weiterhin "gehoert allen" -- das
  // regeln die Aufrufer, nicht diese Funktion.
  function sameEmpName(a,b){return canonName(a)===canonName(b);}

  function entryMatchesEmp(e){
    if(!timeEmp)return true;
    return !e.employeeName||sameEmpName(e.employeeName,timeEmp.name);
  }

  var timeInRange=useMemo(function(){
    return (timeEntries||[]).filter(function(e){
      if(zRange.from&&e.date<zRange.from)return false;
      if(zRange.to&&e.date>zRange.to)return false;
      if(timeEmp&&e.employeeName&&!sameEmpName(e.employeeName,timeEmp.name))return false;
      return true;
    });
  },[timeEntries,zRange,timeEmp,canonName]);

  // v2.58.0: Soll/Ist je Monat.
  // Soll = Arbeitstage (Mo–Fr) x Tageskapazitaet, abzueglich erfasster
  // Abwesenheitstage. "bis heute" beruecksichtigt nur Tage bis einschliesslich
  // heute; fuer vergangene Monate ist das der ganze Monat, fuer kuenftige null.
  // Gesetzliche Feiertage kennt CAPLAN nicht -- sie muessen als Abwesenheit
  // erfasst werden, sonst faellt das Soll zu hoch aus.
  var monthStat=useMemo(function(){
    if(zMode!=="month"||!zMonth)return null;
    var b=monthBounds(zMonth);
    var firstS=dateStr(b.first),lastS=dateStr(b.last),todayS=dateStr(new Date());
    var mtdEnd=todayS<firstS?"":(todayS>lastS?lastS:todayS);
    // v2.59.0: Das Soll wird je Mitarbeiter mit dessen eigener Wochenarbeitszeit
    // gerechnet -- 7 h/Tag gilt nur fuer eine 35-Stunden-Woche. Ist genau ein
    // Mitarbeiter gewaehlt, betrifft es nur ihn; bei "Alle Mitarbeiter" wird
    // ueber das Team summiert, jeder mit seiner eigenen Kapazitaet und seinen
    // eigenen Abwesenheiten.
    var emp=timeEmp;
    var crew=emp?[emp]:(employees||[]);
    var sollAll=0,sollMtd=0,wdAll=0,wdMtd=0,absAll=0,absMtd=0,holAll=0,holMtd=0;
    crew.forEach(function(e){
      var hpd=dailyCapacity(e);
      var cur=new Date(b.y,b.m,1),guard=0;
      while(cur<=b.last&&guard++<40){
        var ds=dateStr(cur);
        if(!isWE(cur)){
          var aType=absenceMap[e.id]&&absenceMap[e.id][ds];
          var isAbs=!!aType;
          if(aType==="feiertag"){holAll++;if(mtdEnd&&ds<=mtdEnd)holMtd++;}
          else if(isAbs){absAll++;if(mtdEnd&&ds<=mtdEnd)absMtd++;}
          else{
            wdAll++;sollAll+=hpd*3600;
            if(mtdEnd&&ds<=mtdEnd){wdMtd++;sollMtd+=hpd*3600;}
          }
        }
        cur.setDate(cur.getDate()+1);
      }
    });
    // Spanne der Tageskapazitaeten fuer die Erlaeuterung unter den Kacheln
    var hpds=crew.map(function(e){return dailyCapacity(e);});
    var hpdMin=hpds.length?Math.min.apply(null,hpds):0;
    var hpdMax=hpds.length?Math.max.apply(null,hpds):0;
    var ist=0,istMtd=0;
    (timeEntries||[]).forEach(function(e){
      if(!e.date||e.date<firstS||e.date>lastS)return;
      if(emp&&e.employeeName&&!sameEmpName(e.employeeName,emp.name))return;
      ist+=(e.seconds||0);
      if(mtdEnd&&e.date<=mtdEnd)istMtd+=(e.seconds||0);
    });
    return {emp:emp,crew:crew,hpdMin:hpdMin,hpdMax:hpdMax,label:monthLabel(zMonth),
      from:firstS,to:lastS,mtdEnd:mtdEnd,
      wdAll:wdAll,wdMtd:wdMtd,absAll:absAll,absMtd:absMtd,holAll:holAll,holMtd:holMtd,
      sollAll:sollAll,sollMtd:sollMtd,
      ist:ist,istMtd:istMtd,
      isCurrent:todayS>=firstS&&todayS<=lastS,
      isFuture:todayS<firstS};
  },[zMode,zMonth,timeEmp,employees,absenceMap,timeEntries,canonName]);

  var timeByWi=useMemo(function(){
    var m={};timeInRange.forEach(function(e){m[e.wiId]=(m[e.wiId]||0)+(e.seconds||0);});
    return m;
  },[timeInRange]);

  // Kaskadierende Auswertung BC -> FC -> Workitem (Kap. 10, ohne Auftraggeber)
  var timeTree=useMemo(function(){
    var bcMap={};
    function bc(name,color){
      if(!bcMap[name])bcMap[name]={name:name,color:color||A.textLight,soll:0,ist:0,fcs:{}};
      return bcMap[name];
    }
    function fc(b,name){
      if(!b.fcs[name])b.fcs[name]={name:name,soll:0,ist:0,wis:[]};
      return b.fcs[name];
    }
    timeWiIndex.forEach(function(w){
      var b=bc(w.bc,w.color),f=fc(b,w.fc||"(ohne FC)");
      var soll=(w.hours||0)*3600,ist=timeByWi[w.id]||0;
      f.wis.push({id:w.id,title:w.title,soll:soll,ist:ist,lcs:w.lcs});
      f.soll+=soll;f.ist+=ist;b.soll+=soll;b.ist+=ist;
    });
    // Buchungen auf Workitems, die es im aktuellen Import nicht (mehr) gibt.
    // Sie duerfen nicht verschwinden (Lastenheft Kap. 12: Stammdaten-Updates
    // veraendern niemals erfasste Zeitbuchungen).
    var orphan={};
    timeInRange.forEach(function(e){
      if(timeWiById[e.wiId])return;
      if(isAcctId(e.wiId)){
        // v2.68.0: Buchung auf eine geloeschte Abrechnungsnummer. Die Zeit bleibt
        // erhalten und wird unter ihrer Nummer weiter ausgewiesen.
        var b2=bc("Abrechnungsnummern",A.mint),f2=fc(b2,"Entfernt");
        var ex=f2.wis.filter(function(x){return x.id===e.wiId;})[0];
        if(!ex){ex={id:e.wiId,title:e.wiTitle||acctNumberOf(e.wiId),soll:0,ist:0,lcs:"entfernt"};f2.wis.push(ex);}
        ex.ist+=(e.seconds||0);f2.ist+=(e.seconds||0);b2.ist+=(e.seconds||0);
        return;
      }
      if(!orphan[e.wiId])orphan[e.wiId]={id:e.wiId,title:e.wiTitle||"",soll:0,ist:0,lcs:"inaktiv"};
      orphan[e.wiId].ist+=(e.seconds||0);
    });
    var orphList=Object.keys(orphan).map(function(k){return orphan[k];});
    if(orphList.length){
      var b=bc("(nicht mehr im Import)",A.textLight);
      var f=fc(b,"—");
      orphList.forEach(function(o){f.wis.push(o);f.ist+=o.ist;b.ist+=o.ist;});
    }
    return Object.keys(bcMap).sort().map(function(k){
      var b=bcMap[k];
      b.fcList=Object.keys(b.fcs).sort().map(function(fk){
        var f=b.fcs[fk];
        f.wis.sort(function(x,y){return y.ist-x.ist;});
        return f;
      });
      return b;
    });
  },[timeWiIndex,timeByWi,timeInRange,timeWiById]);


  // ══════════════════════════════════════════════════════════════════
  // v2.59.0 — Abrechenbare Stunden je Monat
  //
  // Grundgedanke: Ein Workitem traegt seine geplanten Stunden ueber seinen
  // Planungszeitraum. Faellt nur ein Teil davon in den gewaehlten Monat, wird
  // anteilig nach Arbeitstagen umgelegt:
  //     im Monat = geplante Stunden x (Arbeitstage im Monat / Arbeitstage gesamt)
  // Das ergibt die "moeglichen Abrechnungsstunden" des Monats. Dem gegenueber
  // steht, was in diesem Monat tatsaechlich auf diese Workitems gebucht wurde.
  //
  // Bewusste Vereinfachung: die Umlage nutzt reine Arbeitstage (Mo–Fr) und
  // beruecksichtigt keine Abwesenheiten -- ein Workitem verschiebt sich dadurch
  // in CAPLAN ohnehin, und eine zweite Gewichtung waere kaum nachvollziehbar.
  // ══════════════════════════════════════════════════════════════════
  var monthBilling=useMemo(function(){
    if(zMode!=="month"||!zMonth)return null;
    var b=monthBounds(zMonth);
    var mFrom=dateStr(b.first),mTo=dateStr(b.last);
    var empById={};(employees||[]).forEach(function(e){empById[e.id]=e;});
    var rows=[],planTotal=0,billable=0,booked=0,noDates=0;
    // v2.68.0: Eigene Abrechnungsnummern getrennt fuehren -- sie haben keinen
    // Plan und wuerden die Deckungsquote sonst verzerren.
    // Das Kennzeichen kommt aus dem Schnappschuss der BUCHUNG, nicht aus der
    // heutigen Definition der Nummer -- sonst verschoebe eine Umwidmung
    // rueckwirkend bereits erfasste Zeiten. Nur fuer Altbuchungen ohne
    // Schnappschuss wird auf die aktuelle Nummer zurueckgegriffen.
    var acctAgg={},acctBillable=0,acctInternal=0;
    timeInRange.forEach(function(e){
      if(!isAcctId(e.wiId))return;
      var cur=timeWiById[e.wiId];
      var bill=(e.billable!=null)?!!e.billable:(cur?!!cur.billable:true);
      var key=e.wiId+"|"+(bill?"1":"0");
      if(!acctAgg[key])acctAgg[key]={id:e.wiId,number:acctNumberOf(e.wiId),
        title:(cur&&cur.title)||e.wiTitle||acctNumberOf(e.wiId),billable:bill,booked:0};
      acctAgg[key].booked+=(e.seconds||0);
      if(bill)acctBillable+=(e.seconds||0);else acctInternal+=(e.seconds||0);
    });
    var acctRows=Object.keys(acctAgg).map(function(k){return acctAgg[k];});
    timeWiIndex.forEach(function(w){
      if(w.isAcct)return; // ueber die Buchungen bereits erfasst
      var lcs=String(w.lcs||"").toLowerCase();
      if(lcs==="canceled")return;                       // storniert: nie abrechenbar
      if(timeEmp&&w.employee&&w.employee!==timeEmp.id)return;
      var bk=timeByWi[w.id]||0;                         // bereits auf den Monat gefiltert
      var st=w.start||"",en=w.end||"";
      var hasDates=!!(st&&en&&st<=en);
      var wdTotal=hasDates?wdCountLocal(st,en):0;
      var oFrom=st>mFrom?st:mFrom, oTo=en<mTo?en:mTo;
      var wdMonth=(hasDates&&oFrom<=oTo)?wdCountLocal(oFrom,oTo):0;
      var planned=(w.hours||0)*3600;
      var share=wdTotal>0?wdMonth/wdTotal:0;
      var inMonth=Math.round(planned*share);
      if(hasDates&&wdTotal===0&&oFrom<=oTo)inMonth=planned; // Plan nur am Wochenende
      if(wdMonth===0&&bk===0)return;                    // beruehrt den Monat nicht
      if(!hasDates&&bk>0)noDates++;
      var e=empById[w.employee];
      rows.push({id:w.id,title:w.title,bc:w.bc,fc:w.fc,color:w.color,lcs:w.lcs,
        emp:e?e.name:"",start:st,end:en,
        planned:planned,inMonth:inMonth,booked:bk,
        share:share,wdMonth:wdMonth,wdTotal:wdTotal,hasDates:hasDates});
      planTotal+=planned;billable+=inMonth;booked+=bk;
    });
    rows.sort(function(x,y){return (y.inMonth-x.inMonth)||(y.booked-x.booked);});
    acctRows.sort(function(x,y){return y.booked-x.booked;});
    return {rows:rows,planTotal:planTotal,billable:billable,booked:booked,
            count:rows.length,noDates:noDates,label:monthLabel(zMonth),
            acctRows:acctRows,acctBillable:acctBillable,acctInternal:acctInternal};
  },[zMode,zMonth,timeWiIndex,timeByWi,timeEmp,employees]);


  // ══════════════════════════════════════════════════════════════════
  // v2.72.0 — Szenarien-Ansicht (Freiraum Vision)
  // ══════════════════════════════════════════════════════════════════
  function SzenarienView(){
    var baseline=useMemo(function(){return bcDelays(releases);},[releases]);
    var baseById={};baseline.forEach(function(b){baseById[b.id]=b;});

    // Fuer jedes Szenario wird der Verzug einmal durchgerechnet. Der Aufwand
    // haelt sich in Grenzen, weil nur die markierten BCs neu eingeplant werden.
    var results=useMemo(function(){
      return (scenarios||[]).map(function(sc){
        var rels=releases.map(function(r){
          if(!(sc.umbMode&&sc.umbMode[r.id]))return r;
          var res=computeUmbuchungWith(r,sc);
          var sched=res.scheduled;
          return Object.assign({},r,{
            directPackages:(r.directPackages||[]).map(function(p){
              var x=sched[p.id];return (!x||p.lcs==="closed")?p:Object.assign({},p,{start:x.start,end:x.end});}),
            components:r.components.map(function(c){return Object.assign({},c,{
              packages:c.packages.map(function(p){
                var x=sched[p.id];return (!x||p.lcs==="closed")?p:Object.assign({},p,{start:x.start,end:x.end});})});})
          });

        var sum=late.reduce(function(a,x){return a+x.days;},0);
        return {scen:sc,delays:del,late:late.length,worst:worst,sumDays:sum};

    },[scenarios,releases,absenceMap]);

    var card={background:A.surface,border:"1px solid "+A.border,borderRadius:"var(--r-xl)",padding:16};
    var lbl={fontSize:"var(--fs-xs)",fontWeight:700,color:A.textLight,textTransform:"uppercase",letterSpacing:0.6};
    var baseLate=baseline.filter(function(b){return b.late;});

    function delayChip(days,key){

        React.createElement("div",{style:{minWidth:0,flex:1}},

          React.createElement("div",{style:{fontSize:"var(--fs-sm)",color:A.textLight,marginTop:3,lineHeight:1.5}},
            "Ein Szenario h\u00e4lt Annahmen fest \u2014 wer ausf\u00e4llt und welche BCs neu eingeplant werden. ",
            "Verglichen wird der Terminverzug gegen den heutigen Plan.")
        ),
        React.createElement("button",{"data-scen-new":"1",
          onClick:function(){setScenEdit({});},
          style:{padding:"8px 16px",borderRadius:"var(--r-lg)",cursor:"pointer",fontSize:"var(--fs-md)",fontWeight:700,
            border:"none",background:A.mint,color:A.onMint,flexShrink:0}},"+ Szenario")
      ),

      // Ist-Stand als Bezugsgroesse
      React.createElement("div",{style:card},
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}},
          React.createElement("span",{style:{fontSize:"var(--fs-base)",fontWeight:800,color:A.text}},"Heutiger Plan"),
          React.createElement("span",{"data-base-late":String(baseLate.length),
            style:{fontSize:"var(--fs-xs)",fontWeight:700,borderRadius:"var(--r-md)",padding:"1px 8px",
              color:baseLate.length?A.coral:A.green,

            baseLate.length?(baseLate.length+" BC über Termin"):"alle BCs im Termin"),
          React.createElement("span",{style:{fontSize:"var(--fs-xs)",color:A.textLight}},
            baseline.length+" BCs mit Zieltermin")
        ),
        baseline.length===0
          ? React.createElement("div",{style:{fontSize:"var(--fs-md)",color:A.textLight}},
              "Kein BC hat einen Zieltermin \u2014 ohne den l\u00e4sst sich kein Verzug rechnen.")
          : React.createElement("div",null,
              baseline.slice(0,6).map(function(b){
                return React.createElement("div",{key:b.id,"data-base-row":b.id,
                  style:{display:"flex",alignItems:"center",gap:10,padding:"4px 0"}},
                  React.createElement("span",{style:{fontSize:"var(--fs-sm)",color:A.text,flex:1,minWidth:0,
                    whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},b.name),
                  React.createElement("span",{style:{fontSize:"var(--fs-xs)",color:A.textLight,flexShrink:0}},
                    "Ziel "+b.due+" \u00b7 zuletzt "+b.last),
                  delayChip(b.days,"d")
                );
              })
            )
      ),

      // Szenarien
      (scenarios||[]).length===0
        ? React.createElement("div",{style:Object.assign({},card,{textAlign:"center",padding:"28px 16px"})},
            React.createElement("div",{style:{fontSize:"var(--fs-md)",color:A.textLight,lineHeight:1.6}},
              "Noch kein Szenario angelegt. Ein Szenario beantwortet Fragen wie ",
              React.createElement("i",null,"\u201eWas passiert, wenn Petra sechs Wochen ausf\u00e4llt?\u201c"))
          )
        : results.map(function(res){
            var sc=res.scen,act=scenActive===sc.id;
            return React.createElement("div",{key:sc.id,"data-scen-card":sc.id,
              style:Object.assign({},card,{borderColor:act?A.mint:A.border,
                borderWidth:act?2:1,borderStyle:"solid"})},
              React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:10}},
                React.createElement("span",{style:{fontSize:"var(--fs-base)",fontWeight:800,color:A.text}},sc.name),
                act&&React.createElement("span",{style:{fontSize:"var(--fs-2xs)",fontWeight:800,color:A.mint,
                  background:A.mintLight,border:"1px solid "+A.mint,borderRadius:"var(--r-md)",padding:"1px 8px"}},"AKTIV"),
                React.createElement("div",{style:{flex:1}}),
                React.createElement("button",{"data-scen-activate":sc.id,
                  onClick:function(){setScenActive(act?"":sc.id);},
                  style:{padding:"5px 12px",borderRadius:"var(--r-md)",cursor:"pointer",fontSize:"var(--fs-sm)",fontWeight:700,
                    border:"1.5px solid "+A.mint,background:act?A.mint:"transparent",
                    color:act?A.onMint:A.mint}},act?"Beenden":"Anwenden"),
                React.createElement("button",{"data-scen-edit":sc.id,
                  onClick:function(){setScenEdit(sc);},
                  style:{padding:"5px 10px",borderRadius:"var(--r-md)",cursor:"pointer",fontSize:"var(--fs-sm)",fontWeight:700,
                    border:"1px solid "+A.border,background:"transparent",color:A.textMid}},"\u270E"),
                React.createElement("button",{"data-scen-del":sc.id,
                  onClick:function(){

  // Aus den Segmenten des aktiven Timers Buchungen bauen — je Kalendertag
  // eine Zeile (Kap. 4.3). Pausen sind mehrere Segmente am selben Tag und
  // werden zu einer Zeile summiert (Von = frueheste, Bis = spaeteste Zeit).
  function timeBuildEntries(act,comment){
    var byDate={};
    (act.segments||[]).forEach(function(sg){
      if(sg.to==null)return;
      splitAcrossMidnight(sg.from,sg.to).forEach(function(part){
        if(!(part.seconds>0))return;
        var b=byDate[part.date];
        if(!b){byDate[part.date]={date:part.date,start:part.start,end:part.end,seconds:part.seconds};}
        else{
          if(part.start<b.start)b.start=part.start;
          if(part.end>b.end)b.end=part.end;
          b.seconds+=part.seconds;
        }
      });

  // erzeugten Eintraege zurueck (leer, wenn nichts zu buchen war).
  function timeStop(comment){
    if(!timeActive)return [];
    var act=JSON.parse(JSON.stringify(timeActive));
    var last=act.segments[act.segments.length-1];
    if(last&&last.to==null)last.to=Date.now();
    var made=timeBuildEntries(act,comment||"");
    if(made.length)setTimeEntries((timeEntries||[]).concat(made));
    setTimeActive(null);
    return made;
  }

      if(timeActive.wiId===wi.id&&!activeIsPaused(timeActive))return;
      var act=JSON.parse(JSON.stringify(timeActive));
      var last=act.segments[act.segments.length-1];
      if(last&&last.to==null)last.to=Date.now();

      if(made.length)setTimeEntries((timeEntries||[]).concat(made));
    }

                   segments:[{from:Date.now(),to:null}]});

  // Suche fuer die Schnellauswahl. Kap. 18.1/TC-IMP-03: geschlossene bzw.
  // stornierte Workitems erscheinen nicht in der aktiven Suche.
  // v2.58.0: openWorkitems liefert die vollstaendige Liste fuer die Overlays,
  // die selbst filtern und begrenzen. timeSearch bleibt fuer interne Zwecke.
  // v2.84.0: Buchungsziele sind die EIGENEN offenen Workitems plus alle
  // Abrechnungsnummern. Die Nummern gehoeren keinem Mitarbeiter -- Meetings und
  // Support bucht jeder auf dieselbe Kennung. Ohne erkannten Namen bleiben nur
  // die Nummern; auf fremde Arbeitspakete bucht man ohnehin nicht.
  var openWorkitems=useMemo(function(){
    return timeWiIndex.filter(function(w){
      if(w.isAcct)return true;
      var l=(w.lcs||"").toLowerCase();
      if(l==="closed"||l==="canceled")return false;
      return selfEmp?w.employee===selfEmp.id:false;

  // ── v2.84.0: Zuletzt gebuchte Ziele ───────────────────────────────
  // Speist sich aus den eigenen Buchungen statt aus einer gepflegten
  // Merkliste: wer etwas oft bucht, findet es oben, ohne dass jemand eine
  // Liste fuehren muss. Abrechnungsnummern bleiben draussen -- sie haben
  // ihre eigene Gruppe und wuerden die Zeile sonst doppelt fuellen.
  var recentTargets=useMemo(function(){
    var rows=(timeEntries||[]).filter(function(e){
      if(!e||!e.wiId)return false;
      if(isAcctId(e.wiId))return false;
      if(timeEmp&&e.employeeName&&!sameEmpName(e.employeeName,timeEmp.name))return false;
      return true;
    }).sort(function(a,b){
      var ka=(a.date||"")+(a.start||""),kb=(b.date||"")+(b.start||"");
      return ka<kb?1:ka>kb?-1:0;
    });
    var seen={},out=[];
    for(var i=0;i<rows.length&&out.length<8;i++){
      var id=rows[i].wiId;
      if(seen[id])continue;
      seen[id]=true;
      var w=timeWiById[id];
      // Nur noch buchbare Ziele. Verschwundene Workitems bleiben in der
      // Auswertung sichtbar, taugen aber nicht mehr zum Starten.
      // v2.84.0: Was heute startet, steht schon in der ersten Gruppe --
      // dieselbe Schaltflaeche zweimal waere nur Verwirrung.
      if(w&&!startsToday(w))out.push(w);
    }
    return out;
  },[timeEntries,timeWiById,timeEmp,canonName]);

  function timeSearch(q){
    var list=openWorkitems;
    var str=String(q||"").trim().toLowerCase();
    if(!str)return list.slice(0,12);
    var toks=str.split(/\s+/);
    return list.filter(function(w){
      var hay=(String(w.id)+" "+w.title+" "+w.bc+" "+w.fc).toLowerCase();
      for(var i=0;i<toks.length;i++){if(hay.indexOf(toks[i])<0)return false;}
      return true;
    }).slice(0,12);
  }

  // Nachbuchung/Bearbeitung speichern. Ende <= Start wird als Ueberlauf in
  // den Folgetag interpretiert und entsprechend aufgeteilt.
  function saveTimeEdit(draft){
    var t=draft||timeEdit;if(!t)return;
    if(!t.wiId){timeToast("⚠️ Bitte ein Workitem waehlen");return;}
    var st=normTime(t.start),en=normTime(t.end);
    if(!t.date||!st||!en){timeToast("⚠️ Datum, Von und Bis werden benoetigt");return;}
    var sMs=new Date(t.date+"T"+st).getTime();
    var eMs=new Date(t.date+"T"+en).getTime();
    if(isNaN(sMs)||isNaN(eMs)){timeToast("⚠️ Ungueltige Zeitangabe");return;}
    if(eMs<=sMs)eMs+=864e5;
    var w=timeWiById[t.wiId];
    var made=splitAcrossMidnight(sMs,eMs).filter(function(p){return p.seconds>0;}).map(function(p){
      return {id:uid(),wiId:t.wiId,wiTitle:(w&&w.title)||t.wiTitle||"",
              bc:(w&&w.bc)||t.bc||"",fc:(w&&w.fc)||t.fc||"",
              employeeName:timeUser(),date:p.date,start:p.start,end:p.end,
              seconds:p.seconds,comment:t.comment||"",manual:true,
              billable:acctBillableOf(t.wiId)};
    });
    if(!made.length){timeToast("⚠️ Dauer ist 0");return;}
    var base=(timeEntries||[]).filter(function(e){return e.id!==t.id;});
    setTimeEntries(base.concat(made));
    setTimeEdit(null);
    timeToast("✅ Zeitbuchung gespeichert");
  }

  // XLSX statt CSV. SheetJS ist seit der ersten Fassung eingebunden, wurde aber
  // nur zum Lesen der Importdatei benutzt -- die Schreibrichtung war ungenutzt.
  function exportTimeXlsx(){
    if(typeof XLSX==="undefined"||!XLSX.utils||!XLSX.utils.json_to_sheet){
      timeToast("\u26A0 XLSX-Bibliothek nicht geladen \u2014 bitte CSV verwenden");
      return;
    }
    var rows=timeExportRows();
    if(!rows.length){timeToast("\u26A0 Keine Buchungen im Zeitraum");return;}
    try{

      XLSX.utils.book_append_sheet(wb,ws,"Zeiten");
      var d=new Date(),pad=function(n){return(n<10?"0":"")+n;};
      XLSX.writeFile(wb,"CAPLAN_Zeiten_"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+".xlsx");
    }catch(err){

  // ── CSV-Export mit konfigurierbarer Rundung (Kap. 11) ─────────────
  function exportTimeCsv(){
    var head=["Datum","Von","Bis","Dauer_h","Dauer_hhmm","Sekunden_roh","WI-ID","WI-Titel","BC","FC","Gruppe","Mitarbeiter","Kommentar","Art","Abrechenbar"];
    var lines=[head.join(";")];
    timeExportRows().forEach(function(r){
      lines.push(head.map(function(h){
        var v=r[h];
        // Im CSV bleibt das deutsche Dezimalkomma; XLSX bekommt echte Zahlen.
        if(h==="Dauer_h")return csvCell(String(v).replace(".",","));
        return csvCell(v);
      }).join(";"));
    });
    var blob=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
    var d=new Date(),pad=function(n){return(n<10?"0":"")+n;};
    var fname="CAPLAN_Zeiten_"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+".csv";
    var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
    if(isIOS&&navigator.share&&typeof File!=="undefined"){
      try{var f=new File([blob],fname,{type:"text/csv"});
        if(!navigator.canShare||navigator.canShare({files:[f]})){
          navigator.share({files:[f],title:fname}).catch(function(err){if(!err||err.name!=="AbortError")_dl(blob,fname);});return;}
      }catch(_){}
    }
    _dl(blob,fname);
  }

  var idleRef=useRef(Date.now());

  // Wiederkehr-Dialog: verwerfen schneidet das letzte Segment auf den
  // Zeitpunkt der letzten Eingabe zurueck (Kap. 18.3/TC-TIM-03).
  function idleResolve(keep,resume){
    idleRef.current=Date.now();
    if(!keep&&timeActive&&idleAsk){
      var act=JSON.parse(JSON.stringify(timeActive));
      var last=act.segments[act.segments.length-1];
      if(last&&last.to!=null&&idleAsk.since>last.from)last.to=idleAsk.since;
      if(resume)act.segments.push({from:Date.now(),to:null});
      setTimeActive(act);
    }else if(resume&&timeActive){
      var a2=JSON.parse(JSON.stringify(timeActive));
      a2.segments.push({from:Date.now(),to:null});
      setTimeActive(a2);
    }
    setIdleAsk(null);
  }

  useEffect(function(){
