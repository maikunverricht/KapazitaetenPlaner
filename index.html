  function BCPlanungView(){
    var s_zoom=useState("week"); var zoom=s_zoom[0],setZoom=s_zoom[1];
    var s_filter=useState("all"); var filter=s_filter[0],setFilter=s_filter[1];
    var s_exp=useState({}); var exp=s_exp[0],setExp=s_exp[1];
    var s_expandAll=useState(false); var expandAll=s_expandAll[0],setExpandAll=s_expandAll[1];
    var s_showBCP=useState(false); var showBCP=s_showBCP[0],setShowBCP=s_showBCP[1]; // v2.51.0: Spalten-Panel
    var todayStr=dateStr(new Date());

    // ── BC-Name parsen: {product, major, version} ──────────────────────
    function parseBcName(name){
      // "BC : EGSDia / 1.120.0" oder "BC : EGSDia / 4.30.0"
      var m=String(name||"").match(/([A-Za-z0-9_]+)\s*\/\s*(\d+)\.(\S*)/);
      if(!m)return{product:name,major:0,version:[0]};
      var parts=m[2]+"."+m[3];
      var nums=parts.split(".").map(Number);
      return{product:m[1],major:nums[0],version:nums};
    }
    function versionCompare(a,b){
      var va=parseBcName(a.name).version,vb=parseBcName(b.name).version;
      for(var i=0;i<Math.max(va.length,vb.length);i++){
        var d=(va[i]||0)-(vb[i]||0);
        if(d!==0)return d;
      }
      return 0;
    }

    // ── capEnd pro WI aus analysis ─────────────────────────────────────
    var capEndMap=useMemo(function(){
      var m={};
      (analysis||[]).forEach(function(a){if(a&&a.pkg)m[a.pkg.id]=a.capEnd||a.pkg.end;});
      return m;
    },[analysis]);

    // ── BC-Daten aggregieren ───────────────────────────────────────────
    var bcList=useMemo(function(){
      return activeReleases.map(function(r){
        var allWi=(r.directPackages||[]).concat(
          r.components.flatMap(function(c){return c.packages;})
        ).filter(function(p){return p.lcs!=="closed";});

        var predStart="",predDelivery="";
        allWi.forEach(function(p){
          if(!predStart||p.start<predStart)predStart=p.start;
          var ce=capEndMap[p.id]||p.end||"";
          if(ce>predDelivery)predDelivery=ce;
        });

        var effWi=allWi.filter(countsForEffort); // Punkt 2
        var totalH=effWi.reduce(function(s,p){return s+(p.hours||0);},0);
        var remH=effWi.reduce(function(s,p){return s+(p.remainingHours!=null?p.remainingHours:p.hours||0);},0);
        var doneH=Math.max(0,totalH-remH);
        var devSet={};
        allWi.forEach(function(p){if(p.employee)devSet[p.employee]=true;});

        // Ampel
        // v2.88.2: Der Verzug wird in ARBEITSTAGEN gemessen, wie die Spalte
        // Delta AT daneben. Vorher stand hier die Kalendertagsdifferenz: das
        // gelbe Fenster von "5" umfasste damit ueber ein Wochenende nur drei
        // Arbeitstage, und Ampel und Delta-Spalte konnten sich widersprechen.
        // workdaysBetween2 zaehlt exklusive Startdatum -- genau wie deltaAT.
        var ampel="grey";
        if(predDelivery&&r.dueDate){
          var diff=workdaysBetween2(r.dueDate,predDelivery);
          if(diff<=0)ampel="green";
          else if(diff<=DEADLINE_BUFFER)ampel="amber";
          else ampel="red";
        }

        // FCs aggregieren
        var fcList=r.components.map(function(c){
          var fcWi=c.packages.filter(function(p){return p.lcs!=="closed";});
          var fcTotal=fcWi.reduce(function(s,p){return s+(p.hours||0);},0);
          var fcRem=fcWi.reduce(function(s,p){return s+(p.remainingHours!=null?p.remainingHours:p.hours||0);},0);
          var fcDone=Math.max(0,fcTotal-fcRem);
          // SWE-Phasen sammeln
          var phases={};
          fcWi.forEach(function(p){
            var ph=getSwePhase(p.title);
            if(ph)phases[ph]=true;
          });
          var fcPredStart="",fcPredEnd="";
          fcWi.forEach(function(p){
            if(!fcPredStart||p.start<fcPredStart)fcPredStart=p.start;
            var ce=capEndMap[p.id]||p.end||"";
            if(ce>fcPredEnd)fcPredEnd=ce;
          });
          return{
            id:c.id,cqId:c.cqId||"",name:c.name,
            totalH:fcTotal,doneH:fcDone,remH:fcRem,
            phases:Object.keys(phases).map(Number).sort(),
            predStart:fcPredStart,predEnd:fcPredEnd,
            wiCount:fcWi.length
          };
        }).filter(function(fc){return fc.wiCount>0;});

        return{
          id:r.id,name:r.name,cqId:r.cqId||"",
          color:getBcColor(r),
          dueDate:r.dueDate||"",
          predStart:predStart,predDelivery:predDelivery,
          totalH:Math.round(totalH),remH:Math.round(remH),doneH:Math.round(doneH),
          devCount:Object.keys(devSet).length,
          issueCount:0, // aus rawData ggf. befüllbar
          ampel:ampel,
          fcList:fcList,
          allWi:allWi,
          parsed:parseBcName(r.name)
        };
      }).filter(function(bc){return bc.predStart||bc.dueDate;})
        .sort(function(a,b){
          if(!a.dueDate&&!b.dueDate)return 0;
          if(!a.dueDate)return 1;
          if(!b.dueDate)return -1;
          return a.dueDate<b.dueDate?-1:a.dueDate>b.dueDate?1:0;
        });
    },[activeReleases,capEndMap,analysis]);

    // ── BC-zu-BC Abhängigkeiten ────────────────────────────────────────
    var bcDeps=useMemo(function(){
      // Gruppenweise nach Produkt + Hauptversion
      var groups={};
      bcList.forEach(function(bc){
        var p=bc.parsed;
        var key=p.product+"/"+p.major;
        if(!groups[key])groups[key]=[];
        groups[key].push(bc);
      });
      var deps=[];
      Object.values(groups).forEach(function(grp){
        if(grp.length<2)return;
        grp.sort(versionCompare);
        for(var i=0;i<grp.length-1;i++){
          deps.push({from:grp[i].id,to:grp[i+1].id});
        }
      });
      return deps;
    },[bcList]);

    // ── Geteilte FCs ──────────────────────────────────────────────────
    var sharedFcMap=useMemo(function(){
      // fcKey → [bcId, ...]
      var m={};
      bcList.forEach(function(bc){
        bc.fcList.forEach(function(fc){
          var key=fc.cqId||fc.name;
          if(!m[key])m[key]=[];
          m[key].push(bc.id);
        });
      });
      // Nur die die in >1 BC vorkommen
      var result={};
      Object.keys(m).forEach(function(k){if(m[k].length>1)result[k]=m[k];});
      return result;
    },[bcList]);

    // ── Zeitachse ─────────────────────────────────────────────────────
    var units=useMemo(function(){
      if(!bcList.length)return zoom==="day"?getDays("2026-01-01","2026-12-31"):getWeeks("2026-01-01","2026-12-31");
      var dates=[];
      bcList.forEach(function(bc){
        if(bc.predStart)dates.push(new Date(bc.predStart));
        if(bc.predDelivery)dates.push(new Date(bc.predDelivery));
        if(bc.dueDate)dates.push(new Date(bc.dueDate));
      });
      if(!dates.length)return zoom==="day"?getDays("2026-01-01","2026-12-31"):getWeeks("2026-01-01","2026-12-31");
      var mn=new Date(Math.min.apply(null,dates));
      var mx=new Date(Math.max.apply(null,dates));
      mn.setDate(mn.getDate()-14);mx.setDate(mx.getDate()+21);
      return zoom==="day"?getDays(mn,mx):getWeeks(mn,mx);
    },[bcList,zoom]);

    var cw=CW[zoom];
    var tw=units.length*cw;
    var todayX=toX(todayStr,units,cw,zoom);
    var LW=260; // Linke feste Spalte

    // ── Filter ────────────────────────────────────────────────────────
    var filtered=bcList.filter(function(bc){
      if(filter==="red")return bc.ampel==="red";
      if(filter==="redamber")return bc.ampel==="red"||bc.ampel==="amber";
      return true;
    });

    // ── Kapazitätsberechnung pro BC ────────────────────────────────────
    function workdaysBetween(s,e){
      if(!s||!e)return 0;
      var a=new Date(s),b=new Date(e);
      if(isNaN(a.getTime())||isNaN(b.getTime())||b<a)return 0;
      var cnt=0,cur=new Date(a),lim=0;
      while(cur<=b&&lim<100000){if(!isWE(cur))cnt++;cur.setDate(cur.getDate()+1);lim++;}
      return cnt;
    }
    function computeCapacity(bc){
      if(!bc.dueDate)return{status:"nodue"};
      var atTotal=workdaysBetween(todayStr,bc.dueDate);
      if(atTotal<=0)return{status:"overdue"};
      // Beteiligte MA + benötigt pro MA in dieser BC
      var needByEmp={},unassigned=0;
      bc.allWi.forEach(function(p){
        var rem=(p.remainingHours!=null?p.remainingHours:p.hours)||0;
        if(p.lcs==="closed")return;
        if(!countsForEffort(p))return; // Punkt 2
        if(!p.employee){unassigned+=rem;return;}
        needByEmp[p.employee]=(needByEmp[p.employee]||0)+rem;
      });
      var empIds=Object.keys(needByEmp);
      if(!empIds.length&&unassigned===0)return{status:"noemp"};
      // Andere BCs für Belegung
      var rows=[],totalNeed=0,totalNet=0;
      empIds.forEach(function(eid){
        var emp=employees.find(function(e){return e.id===eid;});
        if(!emp)return;
        var hpd=(emp.weeklyHours||35)/5;
        // Brutto: Arbeitstage − Abwesenheit
        var absMap=absenceMap[eid]||{};
        var absDays=0,cur=new Date(todayStr),b=new Date(bc.dueDate),lim=0;
        while(cur<=b&&lim<100000){if(!isWE(cur)&&absMap[dateStr(cur)])absDays++;cur.setDate(cur.getDate()+1);lim++;}
        var brutto=(atTotal-absDays)*hpd;
        // Belegung in anderen BCs (anteilig nach Überschneidung)
        var otherLoad=0;
        bcList.forEach(function(ob){
          if(ob.id===bc.id)return;
          ob.allWi.forEach(function(op){
            if(op.employee!==eid||op.lcs==="closed")return;
            if(!countsForEffort(op))return; // Punkt 2
            var orem=(op.remainingHours!=null?op.remainingHours:op.hours)||0;
            // Überschneidung der WI-Laufzeit mit (heute..Deadline)
            var os=op.start>todayStr?op.start:todayStr;
            var oe=op.end<bc.dueDate?op.end:bc.dueDate;
            if(os<=oe){
              var wiDays=workdaysBetween(op.start,op.end)||1;
              var overlapDays=workdaysBetween(os,oe);
              otherLoad+=orem*(overlapDays/wiDays);
            }
          });
        });
        var netto=Math.max(0,brutto-otherLoad);
        var need=needByEmp[eid];
        rows.push({id:eid,name:emp.name,need:Math.round(need),netto:Math.round(netto),saldo:Math.round(netto-need)});
        totalNeed+=need;totalNet+=netto;
      });
      if(unassigned>0){
        rows.push({name:"(nicht zugewiesen)",need:Math.round(unassigned),netto:0,saldo:-Math.round(unassigned),unassigned:true});
        totalNeed+=unassigned;
      }
      // v2.88.1: Ohne erweiterte Ansicht verlaesst kein fremder Name diese
      // Ansicht. Die fremden Zeilen werden verrechnet, nicht verworfen --
      // Bedarf, Verfuegbarkeit und Luecke bleiben dadurch richtig.
      if(!canSeeAll){
        var ownRows=[],pool=null,poolN=0;
        rows.forEach(function(rw){
          if(rw.unassigned||(selfEmp&&rw.id===selfEmp.id)){ownRows.push(rw);return;}
          poolN++;
          if(!pool)pool={name:"",need:0,netto:0,saldo:0,masked:true};
          pool.need+=rw.need;pool.netto+=rw.netto;pool.saldo+=rw.saldo;
        });
        if(pool){
          pool.name=poolN+(poolN===1?" weiterer Mitarbeiter":" weitere Mitarbeiter");
          ownRows.push(pool);
        }
        rows=ownRows;
      }
      rows.sort(function(a,b){return a.saldo-b.saldo;});
      var gap=Math.max(0,totalNeed-totalNet);
      var avgHpd=7;
      return{
        status:"ok",atTotal:atTotal,
        need:Math.round(totalNeed),avail:Math.round(totalNet),
        gap:Math.round(gap),gapDays:Math.round(gap/avgHpd),
        buffer:Math.round(Math.max(0,totalNet-totalNeed)),
        rows:rows
      };
    }

    var AMPEL={green:"🟢",amber:"🟡",red:"🔴",grey:"⚪"};
    var AMPEL_COL={green:A.green,amber:A.amber,red:A.coral,grey:A.textLight};

    // ── Balken-Helfer ─────────────────────────────────────────────────
    function bcBarX(bc){
      var s=bc.predStart||bc.dueDate;
      return s?toX(s,units,cw,zoom):0;
    }
    function bcBarW(bc){
      var s=bc.predStart||bc.dueDate;
      var e=bc.predDelivery||bc.dueDate;
      if(!s||!e)return cw;
      return barW(s,e,cw,zoom,units);
    }
    function overflowW(bc){
      if(!bc.predDelivery||!bc.dueDate||bc.predDelivery<=bc.dueDate)return 0;
      return barW(bc.dueDate,bc.predDelivery,cw,zoom,units);
    }
    function dueX(bc){
      return bc.dueDate?toX(bc.dueDate,units,cw,zoom):null;
    }

    if(!bcList.length){
      return React.createElement("div",{style:{padding:60,textAlign:"center",color:A.textLight,fontSize:"var(--fs-lg)"}},
        "Keine BC-Daten — bitte ClearQuest-Datei importieren.");
    }

    // ── v2.44.0: Termin-Radar ─────────────────────────────────────────
    // Ersetzt die frühere Zeitachse. Leitfrage: Welcher BC kippt, um wie
    // viele Arbeitstage, und woran liegt es? Sortiert nach Verzug absteigend.

    // Δ in Arbeitstagen. >0 = Prognose nach Ziel (zu spät), <0 = Puffer.
    function deltaAT(bc){
      if(!bc.dueDate||!bc.predDelivery)return null;
      // v2.88.2: Frueher wurde pauschal 1 abgezogen, um das inklusive
      // Startdatum von workdaysBetween wegzurechnen. Das stimmt nur, wenn
      // das Zieldatum SELBST ein Arbeitstag ist -- liegt es auf einem
      // Wochenende, war der Abzug zu viel und die Spalte zeigte einen
      // Arbeitstag zu wenig. workdaysBetween2 zaehlt von Haus aus exklusive
      // Startdatum und ist damit auch die Grundlage der Ampel.
      return workdaysBetween2(bc.dueDate,bc.predDelivery);
    }
    // Kritisches Workitem = das mit dem spätesten capEnd. Es bestimmt die Prognose.
    function critWi(bc){
      var best=null,bestEnd="";
      (bc.allWi||[]).forEach(function(p){
        var ce=capEndMap[p.id]||p.end||"";
        if(ce&&ce>bestEnd){bestEnd=ce;best=p;}
      });
      return best?{pkg:best,end:bestEnd}:null;
    }
    // Geteilte FCs dieses BC (Risiko: Änderungen wirken auf andere BCs)
    function sharedFcsOf(bc){
      return (bc.fcList||[]).filter(function(fc){
        return !!sharedFcMap[fc.cqId||fc.name];
      });
    }

    var radar=filtered.map(function(bc){
      var cap=computeCapacity(bc);
      var d=deltaAT(bc);
      return {
        bc:bc,cap:cap,delta:d,
        worst:(cap.rows&&cap.rows.length)?cap.rows[0]:null,
        crit:critWi(bc),
        shared:sharedFcsOf(bc)
      };
    }).sort(function(a,b){
      var da=(a.delta===null)?-99999:a.delta, db=(b.delta===null)?-99999:b.delta;
      if(db!==da)return db-da;
      return (a.bc.dueDate||"9999-12-31")<(b.bc.dueDate||"9999-12-31")?-1:1;
    });

    // v2.51.0: benutzergewaehlte Sortierung. Leere Werte landen immer am Ende,
    // unabhaengig von der Richtung -- sonst fuellen "-"-Zeilen den Anfang.
    var AMPEL_RANK={red:0,amber:1,green:2,grey:3};
    function bcSortValue(key,x){
      switch(key){
        case "ampel":    return AMPEL_RANK[x.bc.ampel]!=null?AMPEL_RANK[x.bc.ampel]:9;
        case "name":     return x.bc.name||"";
        case "ziel":     return x.bc.dueDate||"";
        case "prognose": return x.bc.predDelivery||"";
        case "delta":    return x.delta;
        case "rest":     return x.bc.remH;
        // Engpass: nach Saldo des kritischsten MA -- groesste Luecke zuerst.
        case "engpass":  return (x.cap&&x.cap.status==="ok"&&x.worst)?x.worst.saldo:null;
        default:         return null;
      }
    }
    function isEmptyVal(v){return v===null||v===undefined||v==="";}
    if(bcSort.key){
      var sKey=bcSort.key,sDir=bcSort.dir;
      var sType=(BC_COL_BY_KEY[sKey]||{}).sort;
      radar=radar.slice().sort(function(a,b){
        var va=bcSortValue(sKey,a),vb=bcSortValue(sKey,b);
        var ea=isEmptyVal(va),eb=isEmptyVal(vb);
        if(ea&&eb)return 0;
        if(ea)return 1;   // Leerwerte immer ans Ende
        if(eb)return -1;
        var c;
        if(sType==="num")c=(Number(va)||0)-(Number(vb)||0);
        else c=String(va).localeCompare(String(vb),"de",{numeric:true,sensitivity:"base"});
        if(c!==0)return c*sDir;
        // Stabiler Zweitschluessel, damit gleiche Werte nicht springen
        return String(a.bc.name).localeCompare(String(b.bc.name),"de",{numeric:true});
      });
    }

    var cntRed=radar.filter(function(x){return x.bc.ampel==="red";}).length;
    var cntAmber=radar.filter(function(x){return x.bc.ampel==="amber";}).length;
    var cntGreen=radar.filter(function(x){return x.bc.ampel==="green";}).length;
    var sumGap=radar.reduce(function(a,x){return a+((x.cap&&x.cap.gap)||0);},0);

    function deltaLabel(d){
      if(d===null)return "–";
      if(d>0)return "+"+d+" AT";
      if(d<0)return d+" AT";
      return "0 AT";
    }
    function deltaColor(d){
      if(d===null)return A.textLight;
      if(d>5)return A.coral;
      if(d>0)return A.amber;
      return A.green;
    }
    function openWi(bc,pkg){
      setEditPkg(Object.assign({},pkg,{
        rc:bc.color,rn:bc.name,cn:"",
        bcDueDate:bc.dueDate||"",fcDueDate:""
      }));
      setModal("editPkg");
    }

    // v2.51.0: Spalten kommen aus dem persistierten Layout statt aus einer
    // festen Liste. COLS = konfigurierte Reihenfolge, visCols = davon sichtbar.
    var COLS=bcCols.order.map(function(k){
      var d=BC_COL_BY_KEY[k];
      return d?{key:k,label:d.label,w:bcCols.w[k]||d.w,align:d.align,sort:d.sort}:null;
    }).filter(Boolean);
    var visCols=COLS.filter(function(c){return !bcCols.hidden[c.key];});
    function th(col){
      var isSrt=bcSort.key===col.key;
      var sortable=!!col.sort;
      return React.createElement("th",{key:col.key,
        onClick:sortable?function(){bcSortClick(col.key);}:null,
        title:sortable?("Sortieren nach "+col.label+" \u00b7 dritter Klick = Standard"):col.label,
        style:{
          padding:"9px 10px",textAlign:col.align==="right"?"right":col.align==="center"?"center":"left",

  // ════════════════════════════════════════════════════════════════════
  // FlowView – freie Canvas mit draggbaren Issue-Karten

  // ════════════════════════════════════════════════════════════════════
  // FlowView – Issue-Board mit horizontalen Swimlanes
  // ════════════════════════════════════════════════════════════════════
  function FlowView(){
    // Mischt eine Hex-Farbe mit weiß zu einer SOLIDEN hellen Variante (für sticky-Spalten)
    function solidTint(hex,a){return tint(hex,a);} // v2.89.0: versteht auch var(...)

    var todayStr=dateStr(new Date());

    // ── State ──────────────────────────────────────────────────────────
    var s_q=useState("");             var q=s_q[0],setQ=s_q[1];
    var s_af=useState("all");         var ampelF=s_af[0],setAmpelF=s_af[1];
    var s_coll=useState({});          var coll=s_coll[0],setColl=s_coll[1];
    var s_exp=useState({});           var exp=s_exp[0],setExp=s_exp[1];
    var s_sc=useState(null);          var sortC=s_sc[0],setSortC=s_sc[1];
    var s_sd=useState(1);             var sortD=s_sd[0],setSortD=s_sd[1];
    var s_kw=useState(false);         var kwMode=s_kw[0],setKwMode=s_kw[1];
    // v2.44.0: hidCols wanderte nach Planungstool (flowCols.hidden), damit die
    // Konfiguration Re-Renders ueberlebt und persistiert werden kann.
    var s_cp=useState(false);         var showCP=s_cp[0],setShowCP=s_cp[1];

    // ── Hilfsfunktionen ────────────────────────────────────────────────
    function atDiff(d1,d2){
      // Arbeitstage zwischen d1 und d2 (positiv wenn d2 > d1)
      if(!d1||!d2)return 0;
      var a=new Date(d1),b=new Date(d2);
      if(isNaN(a)||isNaN(b))return 0;
      var sign=b>=a?1:-1;
      var lo=new Date(Math.min(a.getTime(),b.getTime()));
      var hi=new Date(Math.max(a.getTime(),b.getTime()));
      var cnt=0;
      var cur=new Date(lo);cur.setDate(cur.getDate()+1);
      while(cur<=hi){if(!isWE(cur))cnt++;cur.setDate(cur.getDate()+1);}
      return sign*cnt;
    }
    function relTime(ds){
      if(!ds)return "";
      var diff=Math.round((new Date(ds)-new Date(todayStr))/(864e5));
      if(diff<0)return "überfällig seit "+Math.abs(diff)+"T";
      if(diff===0)return "heute";
      if(diff<14)return "in "+diff+"T";
      if(diff<60)return "in "+Math.ceil(diff/7)+"Wo";
      return "in "+Math.ceil(diff/30)+"Mo";
    }
    function kw(ds){
      if(!ds)return "";
      var d=new Date(ds);
      var jan4=new Date(d.getFullYear(),0,4);
      var wk=Math.ceil(((d-jan4)/864e5+jan4.getDay()+1)/7);
      return "KW "+wk;
    }
    function fd(ds){if(!ds)return "–";return kwMode?kw(ds):ds;}

    // ── capEnd-Map aus analysis ──────────────────────────────────────
    var capEndMap=useMemo(function(){
      var m={};
      (analysis||[]).forEach(function(a){if(a&&a.pkg)m[a.pkg.id]=a.capEnd||a.pkg.end;});
      return m;
    },[analysis]);

    // ── Issue-Aggregation aus rawData ────────────────────────────────
    var issues=useMemo(function(){
      if(!rawData||!rawData.length)return [];
      var issMap={};
      // 1. Issue-Stammdaten aus rawData aufbauen
      rawData.forEach(function(row){
        var issId=(row.iss_id||"").trim();
        if(!issId)return;
        if(!issMap[issId]){
          issMap[issId]={
            id:issId,
            title:row.iss_titel||issId,
            lcs:(row.iss_status||"").toLowerCase(),
            bcName:row.bc_name||"",
            bcId:row.bc_id||"",
            bcPlan:row.bc_deadline||"",
            committed:row.bc_committed||"",
            bcWunsch:"",
            fcMap:{},
            wiIds:[],
          };
        }
        var iss=issMap[issId];
        // FC sammeln
        if(row.fc_name){
          var fk=row.fc_id||row.fc_name;
          if(!iss.fcMap[fk])iss.fcMap[fk]={name:row.fc_name,id:row.fc_id||""};
        }
        // WI-ID sammeln
        var wid=(row.wi_id||"").trim();
        if(wid&&iss.wiIds.indexOf(wid)<0)iss.wiIds.push(wid);
      });
      // 2. Pro Issue: Werte aus allPkgs aggregieren
      return Object.values(issMap).map(function(iss){
        var wis=[];
        iss.wiIds.forEach(function(wid){
          // Suche in allPkgs (nach id)
          var p=allPkgs.find(function(x){return x.id===wid;});
          // Fallback: in releases suchen (falls closed WI nicht in allPkgs)
          if(!p){
            releases.forEach(function(r){
              (r.directPackages||[]).forEach(function(x){if(x.id===wid)p=x;});
              r.components.forEach(function(c){c.packages.forEach(function(x){if(x.id===wid)p=x;});});
            });
          }
          if(p)wis.push(p);
        });
        var totalHours=0,remainingHours=0,predStart="",predDelivery="";
        var hasStartedWI=false;
        var devSet={};
        wis.forEach(function(p){
          totalHours+=(p.hours||0);
          var lcs=(p.lcs||"").toLowerCase();
          if(lcs!=="closed"&&lcs!=="canceled") remainingHours+=(p.remainingHours||0);
          if(lcs==="started") hasStartedWI=true;
          if(!predStart||p.start<predStart) predStart=p.start||"";
          var ce=capEndMap[p.id]||p.end||"";
          if(ce>predDelivery) predDelivery=ce;
          var emp=employees.find(function(e){return e.id===p.employee;});
          if(emp&&emp.name) devSet[emp.name]=true;
        });
        var developers=Object.keys(devSet);
        var missing=[];
        if(!developers.length)missing.push("Kein Assignee");
        if(!predStart)missing.push("Kein Startdatum");
        if(!predDelivery)missing.push("Kein capEnd");
        return {
          id:iss.id,title:iss.title,lcs:iss.lcs,
          bcName:iss.bcName,bcId:iss.bcId,bcPlan:iss.bcPlan,
          committed:iss.committed,bcWunsch:iss.bcWunsch,
          fcList:Object.values(iss.fcMap),
          totalHours:Math.round(totalHours*10)/10,
          remainingHours:Math.round(remainingHours*10)/10,
          predStart:predStart,predDelivery:predDelivery,
          hasStartedWI:hasStartedWI,
          developers:developers,
          wis:wis,wiCount:wis.length,
          missing:missing,
        };
      });
    },[rawData,allPkgs,releases,employees,capEndMap]);

    // ── Ampel ─────────────────────────────────────────────────────────
    function calcAmpel(iss){
      var pred=iss.predDelivery,plan=iss.bcPlan;
      if(iss.predStart&&iss.predStart<todayStr&&!iss.hasStartedWI&&iss.wis.length) return "clock";
      if(!pred||!plan) return "grey";
      var diff=atDiff(plan,pred);
      if(diff<=0) return "green";
      if(diff<=DEADLINE_BUFFER) return "amber";
      return "red";
    }
    // DEADLINE_BUFFER aus globalem Scope nutzen (bereits definiert)

    // ── v2.84.0: Pruefung der Ebenen-Zuordnung ────────────────────────
    // Ebene 1 ist ein Auffangbecken, kein Kriterium. Diese Aufstellung
    // macht sichtbar, was dort landet -- vor allem Statuswerte, die keines
    // der drei benannten Kriterien treffen.
    var laneAudit=useMemo(function(){
      var proStatus={},ohneKriterium=0,gesamt=0,abgeschlossen=0,ueberschrieben=0;
      (issues||[]).forEach(function(iss){
        gesamt++;
        var st=(iss.lcs||"").trim()||"(leer)";
        if(!proStatus[st])proStatus[st]={status:st,n:0,gestartet:0,ebene:null,auffang:false};
        var e=proStatus[st];
        e.n++;
        var hasStart=(iss.wis||[]).some(function(p){return (p.lcs||"").toLowerCase()==="started";});
        if(hasStart)e.gestartet++;
        // Zielebene OHNE die Startregel -- die haengt am Workitem, nicht am Status
        var ebene=st==="committed"?3:st==="evaluated"?2:1;
        e.ebene=ebene;
        if(ebene===1&&st!=="(leer)"){e.auffang=true;}
        if(ebene===1)ohneKriterium++;
        if(st==="closed"||st==="canceled")abgeschlossen++;
        if(laneOverrides[iss.id])ueberschrieben++;
      });
      var liste=Object.keys(proStatus).map(function(k){return proStatus[k];})
        .sort(function(a,b){return b.n-a.n;});
      return {liste:liste,gesamt:gesamt,ohneKriterium:ohneKriterium,
              abgeschlossen:abgeschlossen,ueberschrieben:ueberschrieben};
    },[issues,laneOverrides]);

    var s_showLA=useState(false); var showLA=s_showLA[0],setShowLA=s_showLA[1]; // v2.84.0

    // ── Swimlane-Zuweisung ────────────────────────────────────────────
    function getLane(iss){
      if(iss.hasStartedWI) return 4;
      if(iss.lcs==="committed") return 3;
      if(iss.lcs==="evaluated") return 2;
      return 1;
    }

    // ── Issues anreichern ────────────────────────────────────────────
    var issuesRich=useMemo(function(){
      return issues.map(function(iss){
        var amp=calcAmpel(iss);
        var isNear=false;
        if(amp!=="red"&&iss.predDelivery){
          var diff=Math.round((new Date(iss.predDelivery)-new Date(todayStr))/(864e5));
          if(diff>=0&&diff<=30)isNear=true;
        }
        return Object.assign({},iss,{ampel:amp,isNear:isNear,lane:laneOverrides[iss.id]||getLane(iss)});
      });
    },[issues]);

    // ── Filter ────────────────────────────────────────────────────────
    var noWiCount=issuesRich.filter(function(i){return i.wiCount===0;}).length;
    var totalRed=issuesRich.filter(function(i){return i.ampel==="red";}).length;
    var totalAmber=issuesRich.filter(function(i){return i.ampel==="amber";}).length;
    var totalGreen=issuesRich.filter(function(i){return i.ampel==="green";}).length;

    var filtered=issuesRich.filter(function(iss){
      if(q){
        var lq=q.toLowerCase();
        if(!(iss.title||"").toLowerCase().includes(lq)&&!(iss.id||"").toLowerCase().includes(lq))return false;
      }
      if(ampelF==="red")   return iss.ampel==="red";
      if(ampelF==="redamber") return iss.ampel==="red"||iss.ampel==="amber";
      return true;
    });

    // ── Spalten ───────────────────────────────────────────────────────
    // v2.44.0: Reihenfolge und Breite kommen aus dem persistierten flowCols-State
    var COLS=flowCols.order.map(function(k){
      var d=FLOW_COL_BY_KEY[k];
      return d?{key:k,label:d.label,w:flowCols.w[k]||d.w}:null;
    }).filter(Boolean);
    var visCols=COLS.filter(function(c){return !flowCols.hidden[c.key];});
    var LBLW=flowCols.labelW||FLOW_LABEL_W_DEF; // v2.84.0

    // ── Swimlane-Config ───────────────────────────────────────────────
    var LANES=[
      {id:4,name:"In Bearbeitung",   color:A.violet||"var(--c-violet)"},
      {id:3,name:"Komm. Freigegeben",color:A.mint||"var(--c-green)"},
      {id:2,name:"Klärung / Abschätzung",color:"var(--c-sky)"},
      {id:1,name:"Neu",              color:A.amber||"var(--c-amber)"},
    ];
    var AMPEL_SYM={green:"🟢",amber:"🟡",red:"🔴",grey:"⚪",clock:"⏰"};
    var AMPEL_TIP={
      green:"Rechtzeitig",amber:"Knapp (≤"+DEADLINE_BUFFER+" AT Puffer)",
      red:"Kapazität reicht nicht",grey:"Keine Daten",
      clock:"Überfällig – noch nicht gestartet"
    };

    // ── Summenzeile ───────────────────────────────────────────────────
    function summary(items){
      var rest=items.reduce(function(s,i){return s+(i.remainingHours||0);},0);
      var rc={green:0,amber:0,red:0};
      items.forEach(function(i){if(rc[i.ampel]!==undefined)rc[i.ampel]++;});
      var delayed=items.filter(function(i){return i.predDelivery&&i.bcPlan&&i.predDelivery>i.bcPlan;});
      var avgDel=delayed.length?Math.round(delayed.reduce(function(s,i){return s+atDiff(i.bcPlan,i.predDelivery);},0)/delayed.length):0;
      return {rest:Math.round(rest*10)/10,rc:rc,avgDel:avgDel};
    }

    // ── Excel-Export ─────────────────────────────────────────────────
    function doExport(){
      var hdr=["Issue-Titel","Issue-ID","Ampel","BC","FC(s)","Pred. Start","Pred. Delivery","BC Wunsch","BC Plan","Committed","Rest (h)","Gesamt (h)","Entwickler","Fortschritt %"];
      var rows=[hdr];
      filtered.forEach(function(iss){
        var pct=iss.totalHours>0?Math.round((1-iss.remainingHours/iss.totalHours)*100):0;
        rows.push([
          iss.title,iss.id,
          AMPEL_SYM[iss.ampel]||"",
          iss.bcName+(iss.bcId?" ["+iss.bcId+"]":""),
          iss.fcList.map(function(f){return f.name+(f.id?" ["+f.id+"]":"");}).join("; ")||"",
          iss.predStart||"",iss.predDelivery||"",
          "","",iss.committed||"",
          iss.remainingHours,iss.totalHours,
          iss.developers.join(", "),pct
        ]);
      });
      var ws=XLSX.utils.aoa_to_sheet(rows);
      var wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,"Flow-Ansicht",ws);
      XLSX.writeFile(wb,"FlowAnsicht.xlsx");
    }

    // ── Zellen-Renderer ──────────────────────────────────────────────
    function CellAmpel(iss){
      return React.createElement("span",{title:AMPEL_TIP[iss.ampel]||"",style:{fontSize:"var(--fs-lg)",cursor:"help"}},
        AMPEL_SYM[iss.ampel]||"⚪");
    }

    function getBlockers(issue) {
      var blockers = [];
      
      // 1. Heuristische Regel 1: Gleiche BC + Issue A später fällig
      filtered.forEach(function(other){
        if(other.id!==issue.id && other.bcName===issue.bcName && other.lane<3){
          // other im gleichen BC, noch nicht freigegeben UND früher fällig → echter Blocker-Kandidat
          var otherFc=other.predDelivery?new Date(other.predDelivery):null;
          var issueFc=issue.predDelivery?new Date(issue.predDelivery):null;
          if(otherFc && issueFc && otherFc<issueFc){
            blockers.push(other.id);
          }
        }
      });
      
      // 2. Heuristische Regel 2: Issue A in "Neu" blockiert B in "Klärung"
      var laneToNum={1:1,2:2,3:3,4:4};
      filtered.forEach(function(other){
        if(other.id!==issue.id && other.lane===1 && issue.lane===2 && other.bcName===issue.bcName){
          // other ist "Neu" im GLEICHEN BC, issue ist "Klärung" → other blockiert issue
          blockers.push(other.id);
        }
      });
      
      // 3. Manuelle Blocker hinzufügen
      if(manualBlockers[issue.id]){
        manualBlockers[issue.id].forEach(function(bid){
          if(blockers.indexOf(bid)<0)blockers.push(bid);
        });
      }
      
      // Duplikate entfernen
      return Array.from(new Set(blockers));
    }

    function BlockerIcon(issue){
      var blockers=getBlockers(issue);
      if(blockers.length===0)return null;
      return React.createElement("span",{title:"Blockiert durch: "+blockers.map(function(bid){return "#"+bid;}).join(", "),
        style:{marginLeft:6,cursor:"help",fontSize:"var(--fs-sm)",color:"var(--c-coral-ink)",fontWeight:700}},"🔴");
    }
    function getGlobalPriority(issue){
      var sorted=filtered.slice().sort(function(a,b){
        var aDue=a.predDelivery?new Date(a.predDelivery).getTime():Infinity;
        var bDue=b.predDelivery?new Date(b.predDelivery).getTime():Infinity;
        return aDue-bDue;
      });
      var ix=sorted.findIndex(function(i){return i.id===issue.id;});
      return ix>=0?ix+1:0;
    }
    function getProPriority(empName,issue){
      var empIssues=filtered.filter(function(i){return (i.developers||[]).indexOf(empName)>=0;});
      var sorted=empIssues.slice().sort(function(a,b){
        var aDue=a.predDelivery?new Date(a.predDelivery).getTime():Infinity;
        var bDue=b.predDelivery?new Date(b.predDelivery).getTime():Infinity;
        return aDue-bDue;
      });
      if(prioOrder[empName]){
        var mo=prioOrder[empName];
        sorted=sorted.sort(function(a,b){return (mo[a.id]||Infinity)-(mo[b.id]||Infinity);});
      }
      var ix=sorted.findIndex(function(i){return i.id===issue.id;});
      return ix>=0?ix+1:0;
    }
    function PriorityBadge(empName,issue){
      var proPrio=getProPriority(empName,issue);

      holCfg:s.holCfg, // v2.71.0: Feiertagskalender
      scenarios:s.scenarios // v2.72.0: Szenarien
    };
    var blob=new Blob([JSON.stringify(payload)],{type:"application/json"});
    var d=new Date();
    var pad=function(n){return (n<10?"0":"")+n;};
    var fname="CAPLAN_Backup_"+d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"_"+pad(d.getHours())+pad(d.getMinutes())+".json";
    function dlFallback(){
      var url=URL.createObjectURL(blob);

      a.href=url;a.download=fname;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(url);},2000);
    }

    // sonst klassischer Download. Share-Abbruch/-Fehler fällt auf Download zurück.
    var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
    if(isIOS&&navigator.share&&typeof File!=="undefined"){

            if(!err||err.name!=="AbortError")dlFallback();

          return;
        }

  // Der waagerechte Balken ist auf grossen Zeitraeumen weit unten und auf

  // Flaeche schiebt den Ausschnitt -- Balken, Knoepfe und Eingaben bleiben
  // ausgenommen, damit Verschieben und Aufklappen sich nicht ins Gehege kommen.
  useEffect(function(){
    var sc=document.getElementById("main-scroll");
    if(!sc)return;
    var st=null;
    var SKIP="[data-pkgid],[data-resize],button,input,select,textarea,a,label,.col-resize-handle";
    function down(e){
      if(e.button!=null&&e.button!==0)return;
      if(e.target&&e.target.closest&&e.target.closest(SKIP))return;
      st={x:e.clientX,y:e.clientY,sl:sc.scrollLeft,st:sc.scrollTop,moved:false};
    }
    function move(e){
      if(!st)return;
      var dx=e.clientX-st.x,dy=e.clientY-st.y;
      if(!st.moved&&Math.abs(dx)<4&&Math.abs(dy)<4)return;
      if(!st.moved){st.moved=true;sc.classList.add("panning");}
      sc.scrollLeft=st.sl-dx;
      sc.scrollTop=st.st-dy;
      if(e.cancelable)e.preventDefault();
    }
    function up(){
      if(!st)return;
      var moved=st.moved;st=null;
      sc.classList.remove("panning");
      // Ein echtes Verschieben darf nicht zusaetzlich als Klick gelten.
      if(moved)window.addEventListener("click",function stop(ev){
        ev.stopPropagation();ev.preventDefault();
        window.removeEventListener("click",stop,true);
      },true);
    }
    sc.addEventListener("pointerdown",down);
    window.addEventListener("pointermove",move,{passive:false});
    window.addEventListener("pointerup",up);
    window.addEventListener("pointercancel",up);
    return function(){
      sc.removeEventListener("pointerdown",down);
      window.removeEventListener("pointermove",move);
      window.removeEventListener("pointerup",up);
      window.removeEventListener("pointercancel",up);
    };
