function remapClearQuestColumns(rows){
  // Übersetzt neue CQ-Objektpfad-Spalten (hasWorkitems.*) auf die vom Parser erwarteten Namen
  if(!rows||!rows.length)return rows;
  var MAP={
    "hasWorkitems.id":"Id Workitem",
    "hasWorkitems.Title":"Titel Workitem",
    "hasWorkitems.Type":"Type Workitem",
    "hasWorkitems.LifeCycleState":"LCS Workitem",
    "hasWorkitems.PlannedDate":"PlannedDate Workitem",
    "hasWorkitems.StartDate":"StartDate Workitem",
    "hasWorkitems.SubmitDate":"SubmitDate Workitem",
    "hasWorkitems.Assignee.fullname":"Assignee Workitem",
    "hasWorkitems.EstimatedEffort":"EstimationEffort Workitem",
    "Submitter":"Submitter Issue"
  };
  // Nur remappen wenn neue Spalten vorhanden und alte fehlen
  var h=rows[0];
  if(h["Id Workitem"]!==undefined)return rows; // bereits altes Format
  if(h["hasWorkitems.id"]===undefined)return rows; // kein hasWorkitems-Format
  return rows.map(function(r){
    var nr=Object.assign({},r);
    for(var src in MAP){
      if(r[src]!==undefined&&nr[MAP[src]]===undefined){nr[MAP[src]]=r[src];}
    }
    return nr;
  });
}

function isClearQuestFormat(rows){
  if(!rows||!rows[0])return false;
  var h=rows[0];
  // Workitem-Export (Standard) ODER Issue-only-Export (ohne Workitems)
  return !!(h["Id Workitem"]!==undefined||h["Assignee Workitem"]!==undefined||
            h["EstimationEffort Workitem"]!==undefined||
            (h["ID Issue"]!==undefined&&h["LCS Issue"]!==undefined));
}

// ── FC Qualitäts-Parser ──────────────────────────────────────────────
function parseFcTags(tagsXml){
  // Extrahiert Safety, OBD, Exhaust aus XML-Tags
  function getTag(xml,tag){var m=String(xml||"").match(new RegExp("<"+tag+">([^<]*)<\/"+tag+">","i"));return m?m[1].trim():null;}
  var safety=getTag(tagsXml,"Safety");
  var obd=getTag(tagsXml,"OBD");
  var exhaust=getTag(tagsXml,"Exhaust");
  var missing=[];
  if(!safety)missing.push("Safety");
  if(!obd)missing.push("OBD");
  if(!exhaust)missing.push("Exhaust");
  return{safety:safety,obd:obd,exhaust:exhaust,missing:missing,complete:missing.length===0};
}

function parseFcExtDesc(extDesc){
  // Extrahiert die 4 Pflichtfelder aus dem ExternalDescription-Text
  var text=String(extDesc||"");
  function getField(label){var m=text.match(new RegExp(label+"[:\\s]*([^\\n]+)","i"));return m?m[1].trim():"";}
  var changeDesc=getField("Change Description");
  var reqNeutral=getField("Requirement-Neutrality\\??");
  var funcNeutral=getField("Functional-Neutrality\\??");
  var hexNeutral=getField("Impact on Hex-Neutrality\\??");
  var missing=[];
  if(!changeDesc)missing.push("Change Description");
  if(!reqNeutral)missing.push("Requirement-Neutrality");
  if(!funcNeutral)missing.push("Functional-Neutrality");
  if(!hexNeutral)missing.push("Hex-Neutrality");
  return{changeDesc:changeDesc,reqNeutral:reqNeutral,funcNeutral:funcNeutral,hexNeutral:hexNeutral,missing:missing,complete:missing.length===0};
}


function validateClearQuestColumns(rows){
  // Prüft Pflicht-Spalten (nach Remapping). Gibt fehlende zurück.
  var REQUIRED=[
    {col:"ID Issue",        alt:["Id Issue"]},
    {col:"Titel Issue",     alt:[]},
    {col:"LCS Issue",       alt:[]},
    {col:"Id Workitem",     alt:["hasWorkitems.id"]},
    {col:"Titel Workitem",  alt:["hasWorkitems.Title"]},
    {col:"Assignee Workitem",alt:["hasWorkitems.Assignee.fullname"]},
    {col:"StartDate Workitem",alt:["hasWorkitems.StartDate"]},
    {col:"hasMappedReleases.hasMappedRelease.Title",alt:[]},
    {col:"hasMappedReleases.hasMappedRelease.hasMappedChildren.hasMappedChildRelease.Title",alt:[]}
  ];
  if(!rows||!rows.length)return{ok:false,missing:["(Datei ist leer)"]};
  var avail=Object.keys(rows[0]);
  function has(names){return names.some(function(n){return avail.some(function(a){return a.trim()===n||a.trim().toLowerCase()===n.toLowerCase();});});}
  var missing=REQUIRED.filter(function(req){return !has([req.col].concat(req.alt));}).map(function(req){return req.col;});
  return{ok:missing.length===0,missing:missing};
}

function parseClearQuestIssueOnly(rows){
  // Issue-only Export: keine Workitems, nur Issues + BC/FC Mappings
  if(!rows||!rows.length)return{packages:[],releases:[],employees:[]};
  var issueMap={};
  var bcMap={};
  var fcMap={};
  var ui=0;
  function uid(){return"iq"+(++ui);}

  rows.forEach(function(r){
    var issId=String(r["ID Issue"]||r["Id Issue"]||"").trim();
    if(!issId||issId==="None")return;
    
    // Issue anlegen (falls neu)
    if(!issueMap[issId]){
      issueMap[issId]={
        id:issId,
        title:String(r["Titel Issue"]||"").trim(),
        lcs:String(r["LCS Issue"]||"").trim().toLowerCase(),
        type:String(r["Type Issue"]||"").trim(),
        estimatedEffort:Number(r["EstimatedEffort Issue"])||0,
        packages:[]
      };
    }
    
    // BC/FC Mapping
    var bcId=String(r["hasMappedReleases.hasMappedRelease.id"]||"").trim();
    var bcTitle=String(r["hasMappedReleases.hasMappedRelease.Title"]||"").trim();
    var bcType=String(r["hasMappedReleases.hasMappedRelease.Type"]||"").trim();
    var bcPlanned=String(r["hasMappedReleases.hasMappedRelease.PlannedDate"]||"").trim();
    var bcFreeze=String(r["hasMappedReleases.hasMappedRelease.ImplementationFreeze"]||"").trim();
    var fcTags=String(r["hasMappedReleases.hasMappedRelease.hasMappedChildren.hasMappedChildRelease.Tags"]||"").trim();
    var fcExtDesc=String(r["hasMappedReleases.hasMappedRelease.hasMappedChildren.hasMappedChildRelease.ExternalDescription"]||"").trim();

    if(bcId&&bcTitle&&!bcMap[bcId]){
      bcMap[bcId]={id:bcId,title:bcTitle,type:bcType,plannedDate:bcPlanned,implFreeze:bcFreeze,issues:[],fcTags:fcTags,fcExtDesc:fcExtDesc};
    }
    // Tags/Beschreibung nachtragen falls erste Zeile leer war
    if(bcId&&bcMap[bcId]){
      if(fcTags&&!bcMap[bcId].fcTags)bcMap[bcId].fcTags=fcTags;
      if(fcExtDesc&&!bcMap[bcId].fcExtDesc)bcMap[bcId].fcExtDesc=fcExtDesc;
    }
    if(bcId&&bcMap[bcId]&&!bcMap[bcId].issues.includes(issId)){
      bcMap[bcId].issues.push(issId);
    }
  });

  // Issues als Pakete für das Tool aufbereiten
  var releases=Object.values(bcMap).filter(function(b){return b.type==="BC";}).map(function(b){
    return{id:b.id,name:b.title,dueDate:b.plannedDate||"",implFreeze:b.implFreeze||"",issueCount:b.issues.length};
  });

  // Einfache Pakete pro Issue (ohne Workitems)
  var packages=Object.values(issueMap).map(function(iss){
    return{
      id:uid(),rn:iss.id,title:iss.title,lcs:iss.lcs,
      employee:"",start:"",end:"",hours:iss.estimatedEffort||0,
      remainingHours:iss.estimatedEffort||0,issueLcs:iss.lcs,issueType:iss.type
    };
  });

  return{packages:packages,releases:releases,employees:[],_issueOnlyImport:true};
}

function parseClearQuest(rows){
  // Spalten-Validierung: fehlende Pflicht-Spalten melden
  var _val=validateClearQuestColumns(rows);
  if(!_val.ok){
    var _msg="Fehlende Pflicht-Spalten beim Import:\n"+_val.missing.map(function(m){return "  • "+m;}).join("\n");
    if(typeof window!=="undefined"&&window._setImportWarning){window._setImportWarning(_msg);}
    console.warn("[Import]",_msg);
  }
  // Issue-only Format (keine Workitem-Spalten)?
  if(rows&&rows[0]&&rows[0]["Id Workitem"]===undefined&&rows[0]["Assignee Workitem"]===undefined){
    return parseClearQuestIssueOnly(rows);
  }
  // ── Zeilen-Vorfilter (wird vor jeder weiteren Verarbeitung ausgeführt) ─────
  // Hilfsfunktion: Spaltenwert normalisiert lesen
  function col(r,name){return String(r[name]||"").trim().toLowerCase();}
  function isCancClos(v){return v==="canceled"||v==="closed";}

  // Filter 1: LCS Issue canceled/closed
  rows=rows.filter(function(r){
    var v=col(r,"LCS Issue")||col(r,"lcs Issue")||col(r,"lcs issue");
    return !isCancClos(v);
  });
  // Filter 2: LCS Workitem canceled/closed
  rows=rows.filter(function(r){
    var v=col(r,"LCS Workitem")||col(r,"lcs Workitem")||col(r,"lcs workitem");
    return !isCancClos(v);
  });
  // Filter 3: hasMappedReleases.hasMappedRelease.Type == "FC"
  rows=rows.filter(function(r){
    var v=String(r["hasMappedReleases.hasMappedRelease.Type"]||"").trim();
    return v.toUpperCase()!=="FC";
  });
  // Filter 4: hasMappedReleases.LifeCycleState canceled/closed
  rows=rows.filter(function(r){
    var v=col(r,"hasMappedReleases.LifeCycleState");
    return !isCancClos(v);
  });
  // Filter 5: hasMappedReleases.hasMappedRelease.hasMappedChildren,hasMappedChildRelease.LifeCycleState canceled/closed
  rows=rows.filter(function(r){
    var v=col(r,"hasMappedReleases.hasMappedRelease.hasMappedChildren,hasMappedChildRelease.LifeCycleState");
    return !isCancClos(v);
  });
  // Filter 6: hasMappedReleases.hasMappedRelease.hasMappedChildren.LifeCycleState canceled/closed
  rows=rows.filter(function(r){
    var v=col(r,"hasMappedReleases.hasMappedRelease.hasMappedChildren.LifeCycleState");
    return !isCancClos(v);
  });
  function parseDate(s){
    if(!s)return "";s=String(s).trim();
    var fmts=[
      {re:/^(\d{2})\.(\d{2})\.(\d{2}),\s*/,fn:function(m){return "20"+m[3]+"-"+m[2]+"-"+m[1];}},
      {re:/^(\d{2})\.(\d{2})\.(\d{4}),\s*/,fn:function(m){return m[3]+"-"+m[2]+"-"+m[1];}},
      {re:/^(\d{2})\.(\d{2})\.(\d{2})$/,fn:function(m){return "20"+m[3]+"-"+m[2]+"-"+m[1];}},
      {re:/^(\d{2})\.(\d{2})\.(\d{4})$/,fn:function(m){return m[3]+"-"+m[2]+"-"+m[1];}},
    ];
    for(var i=0;i<fmts.length;i++){var m=s.match(fmts[i].re);if(m)return fmts[i].fn(m);}
    return "";
  }
  function cleanName(s){if(!s)return "";return String(s).trim().replace(/\s*\(.*?\)\s*$/g,"").trim();}
  function cleanDept(s){if(!s)return "";var m=String(s).trim().match(/\(([^)]+)\)\s*$/);return m?m[1].trim():"";}
  function getReff(xml){if(!xml)return null;var m=String(xml).match(/R_Eff="([^"]*)"/);if(m&&m[1]){var v=parseFloat(m[1]);if(!isNaN(v))return v;}return null;}
  // Rem_Eff / Tag_Rem_Eff: direkt in Stunden (kein ×8)
  // Sowohl R_Eff als auch Rem_Eff sind Stundenwerte in ClearQuest
  function getTagRemEff(row,xml){
    var direct=parseFloat(row["Tag_Rem_Eff Workitem"]||row["Tag_Rem_Eff"]||row["Rem_Eff Workitem"]||"");
    if(!isNaN(direct)&&direct>=0)return direct;
    if(xml){
      // Suche Rem_Eff="X" (echte CQ-Daten) UND Tag_Rem_Eff="X" (älteres Format)
      var m=String(xml).match(/Rem_Eff="([^"]+)"/);
      if(m&&m[1]){var v=parseFloat(m[1]);if(!isNaN(v)&&v>0)return v;}
      var m2=String(xml).match(/Tag_Rem_Eff="([^"]+)"/);
      if(m2&&m2[1]){var v2=parseFloat(m2[1]);if(!isNaN(v2))return v2;}
    }
    return null;
  }

  // Erst alle Workitem-Stammdaten sammeln (Aufwand, Mitarbeiter, etc.)
  var widData={};
  rows.forEach(function(r){
    var wid=String(r["Id Workitem"]||"").trim();
    if(!wid||wid==="None")return;
    if(!widData[wid])widData[wid]=r;
  });

  // Alle einzigartigen BC×FC-Kombinationen pro Workitem sammeln (vom Issue geerbt)
  var widBcFc={};  // wid → [{key,bc,bcDate,fc,fcDate,fcTags:r.fc_tags||"",fcExtDesc:r.fc_ext_desc||""}]
  rows.forEach(function(r){
    var wid=String(r["Id Workitem"]||"").trim();
    if(!wid||wid==="None")return;
    var bc =String(r["hasMappedReleases.hasMappedRelease.Title"]||"").trim();
    var bcD=String(r["hasMappedReleases.hasMappedRelease.PlannedDate"]||"").trim();
    var bcId=String(r["hasMappedReleases.hasMappedRelease.id"]||r["hasMappedReleases.hasMappedRelease.Id"]||"").trim();
    var fc =String(r["hasMappedReleases.hasMappedRelease.hasMappedChildren.hasMappedChildRelease.Title"]||"").trim();
    var fcD=String(r["hasMappedReleases.hasMappedRelease.hasMappedChildren.hasMappedChildRelease.PlannedDate"]||"").trim();
    var fcId=String(r["hasMappedReleases.hasMappedRelease.hasMappedChildren.hasMappedChildRelease.id"]||r["hasMappedReleases.hasMappedRelease.hasMappedChildren.hasMappedChildRelease.Id"]||"").trim();
    if(!bc)return;
    if(!widBcFc[wid])widBcFc[wid]=[];
    var key=bc+"|||"+(fc||"__none__");
    if(!widBcFc[wid].find(function(x){return x.key===key;}))
      widBcFc[wid].push({key:key,bc:bc,bcDate:bcD,bcId:bcId,fc:fc||"Sonstige",fcDate:fcD,fcId:fcId});
  });

  // Titel-Matching: Workitem anhand seines Titels genau einer BC×FC zuordnen.
  // Alle BC- und FC-Namen des Issues werden als Kandidaten geprüft (längster zuerst).
  // FC-Namen haben Vorrang vor BC-Namen (spezifischer).
  // Kein Match → "Sonstige" unter der ersten BC.
  function matchCombo(titel, combos){
    if(!combos||!combos.length)return null;
    var cands=[];
    combos.forEach(function(c){
      if(c.fc&&c.fc!=="Sonstige")cands.push({name:c.fc,type:"fc",combo:c});
      cands.push({name:c.bc,type:"bc",combo:c});
    });
    cands.sort(function(a,b){return b.name.length-a.name.length;});
    for(var i=0;i<cands.length;i++){
      var esc=cands[i].name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
      var re=new RegExp("(?<![A-Za-z0-9])"+esc+"(?![A-Za-z0-9])","i");
      if(re.test(titel)){
        if(cands[i].type==="bc"){
          // BC-Match: reale FC dieser BC nehmen, falls vorhanden
          var fcOfBc=combos.find(function(x){return x.bc===cands[i].combo.bc&&x.fc&&x.fc!=="Sonstige";});
          if(fcOfBc)return Object.assign({},fcOfBc,{matchType:"fc"});
          return Object.assign({},cands[i].combo,{matchType:"bc"}); // v2.41.0: matchType gesetzt (war undefined -> FCs leer)
        }
        return Object.assign({},cands[i].combo,{matchType:"fc"});
      }
    }
    return null; // kein Match
  }

  var empMap={},releaseMap={};

  Object.keys(widData).forEach(function(wid){
    var r=widData[wid];
    var issueLcs=String(r["LCS Issue"]||r["lcs Issue"]||r["lcs issue"]||"").trim().toLowerCase();
    var assignee=cleanName(r["Assignee Workitem"]);
    var dept    =cleanDept(r["Assignee Workitem"]);
    var titel   =String(r["Titel Workitem"]||"").trim();
    var start   =parseDate(r["StartDate Workitem"]);
    var end     =parseDate(r["PlannedDate Workitem"]);
    var tagsXml =r["hasWorkitems.Tags"]||"";
    var rEffH   =getReff(tagsXml);        // R_Eff = Gesamtaufwand (Stunden)
    var tagRemH =getTagRemEff(r,tagsXml); // Rem_Eff = Restaufwand (Stunden)
    // Regel: hours = R_Eff; remHours = Rem_Eff; wenn Rem_Eff leer → remHours = hours
    // Fallback: EstimationEffort wenn R_Eff fehlt; letzter Fallback: 8h
    var estH    =parseFloat(r["EstimationEffort Workitem"])||0;
    var hours   =rEffH!=null&&rEffH>0 ? rEffH : (estH>0 ? estH : 8);
    var lcs     =String(r["lcs Workitem"]||r["LCS Workitem"]||r["lcs workitem"]||r["Status"]||r["status"]||"").trim().toLowerCase();
    var today   =dateStr(new Date());

    var remHours;
    if(lcs==="closed"){
      remHours=0;
    } else {
      if(tagRemH!=null&&tagRemH>=0) remHours=Math.round(tagRemH*10)/10;
      else                          remHours=hours; // Rem_Eff leer → Rest = Gesamt
    }

    if(!start)start=today;if(end&&end<start)end=start;if(!end)end=start;
    if(assignee&&!empMap[assignee])empMap[assignee]={id:uid(),name:assignee,role:"",department:dept,weeklyHours:35};
    var empId=assignee&&empMap[assignee]?empMap[assignee].id:"";

    // Titel-Matching: FC-Match → unter FC; BC-Match oder kein Match → direkt unter BC
    var combos=widBcFc[wid]||[];
    var matched=matchCombo(titel,combos);
    var relName,relDate,fcName,fcDate,matchType;
    if(matched){
      relName=matched.bc; relDate=parseDate(matched.bcDate);
      fcName=matched.fc;  fcDate=parseDate(matched.fcDate);
      matchType=matched.matchType; // "fc" oder "bc"
    } else {
      var first=combos[0];
      relName=first?first.bc:"Sonstige"; relDate=first?parseDate(first.bcDate):"";
      fcName="Sonstige"; fcDate=""; matchType="none";
    }
    var bcCqId=(matched&&matched.bcId)||"";
    var fcCqId=(matched&&matched.fcId)||"";
    if(!releaseMap[relName])releaseMap[relName]={id:uid(),cqId:bcCqId,name:relName,dueDate:relDate,color:PKG_COLORS[Object.keys(releaseMap).length%PKG_COLORS.length],components:{},directPackages:[]};
    else if(bcCqId&&!releaseMap[relName].cqId)releaseMap[relName].cqId=bcCqId;
    var pkg={id:wid,title:titel,employee:empId,start:start,end:end,hours:hours,remainingHours:remHours,dependencies:[],lcs:lcs,issueLcs:issueLcs,_estH:estH,_rEffH:rEffH,_remEffH:tagRemH};
    if(matchType==="fc"){
      if(!releaseMap[relName].components[fcName])releaseMap[relName].components[fcName]={id:uid(),cqId:fcCqId,name:fcName,dueDate:fcDate,packages:[]};
      else if(fcCqId&&!releaseMap[relName].components[fcName].cqId)releaseMap[relName].components[fcName].cqId=fcCqId;
      releaseMap[relName].components[fcName].packages.push(pkg);
    } else {
      releaseMap[relName].directPackages.push(pkg);
    }
  });

  // ── Versionsnummer aus Titel extrahieren ───────────────
  // Extrahiert die erste Folge von Zahlen+Punkten aus einem Titel
  // z.B. "BC 1.2.3" → [1,2,3], "FC2.0 Final" → [2,0], "Sonstige" → []
  function extractVersion(name){
    var m=String(name).match(/(\d+(?:\.\d+)*)/);
    if(!m)return [];
    return m[1].split(".").map(Number);
  }
  function compareVersions(a,b){
    var va=extractVersion(a),vb=extractVersion(b);
    for(var i=0;i<Math.max(va.length,vb.length);i++){
      var na=va[i]||0,nb=vb[i]||0;
      if(na!==nb)return na-nb;
    }
    return a.localeCompare(b); // Fallback: alphabetisch
  }

  // Releases und FCs nach Versionsnummer sortieren
  var sortedReleases=Object.values(releaseMap)
    .sort(function(a,b){return compareVersions(a.name,b.name);})
    .map(function(r){
      var sortedComponents=Object.values(r.components)
        .sort(function(a,b){return compareVersions(a.name,b.name);});
      return{...r,components:sortedComponents};
    });

  // ── Automatische BC/FC-Abhängigkeiten ─────────────────
  // Jede FC erhält alle Pakete der Vorgänger-FC als Abhängigkeit (letztes Paket je Mitarbeiter).
  // Vorgänger-FC = vorherige FC derselben BC (nach Versionsreihenfolge).
  // Erste FC einer BC → Vorgänger ist letzte FC der vorherigen BC.
  // Nur wenn beide FCs Pakete enthalten.
  function lastPkgOfFc(fc){
    // Letztes Paket (nach Enddatum) der FC
    if(!fc.packages.length)return null;
    return fc.packages.slice().sort(function(a,b){return a.end>b.end?-1:a.end<b.end?1:0;})[0];
  }

  // Flache Liste aller FCs in globaler BC/FC-Reihenfolge
  var allFcsOrdered=[];
  sortedReleases.forEach(function(r){
    r.components.forEach(function(c){
      allFcsOrdered.push({bc:r,fc:c});
    });
  });

  // Abhängigkeiten setzen: jedes Paket einer FC → letztes Paket der Vorgänger-FC
  allFcsOrdered.forEach(function(item,idx){
    if(idx===0)return; // erste FC hat keinen Vorgänger
    var prevFc=allFcsOrdered[idx-1].fc;
    var predPkg=lastPkgOfFc(prevFc);
    if(!predPkg)return;
    item.fc.packages.forEach(function(pkg){
      if(pkg.dependencies.indexOf(predPkg.id)<0){
        pkg.dependencies.push(predPkg.id);
      }
    });
  });

  var issueIds=new Set(),bcIds=new Set(),fcIds=new Set(),wiIds=new Set();
  rows.forEach(function(r){
    var issId=String(r["Id"]||r["Id Issue"]||r["ID Issue"]||"").trim(); // Nur Issue-IDs
    if(issId)issueIds.add(issId);
    var bcId=String(r["hasMappedReleases.hasMappedRelease.id"]||r["hasMappedReleases.hasMappedRelease.Id"]||"").trim()||String(r["hasMappedReleases.hasMappedRelease.Title"]||"").trim();
    if(bcId)bcIds.add(bcId);
    var fcId=String(r["hasMappedReleases.hasMappedRelease.hasMappedChildren.hasMappedChildRelease.id"]||r["hasMappedReleases.hasMappedRelease.hasMappedChildren.hasMappedChildRelease.Id"]||"").trim()||String(r["hasMappedReleases.hasMappedRelease.hasMappedChildren.hasMappedChildRelease.Title"]||"").trim();
    if(fcId)fcIds.add(fcId);
    var wiId=String(r["Id Workitem"]||"").trim();
    if(wiId)wiIds.add(wiId);
  });
  return{employees:Object.values(empMap),releases:sortedReleases,
    rawRows:rows,
    stats:{issues:issueIds.size,bcs:bcIds.size,fcs:fcIds.size,workitems:wiIds.size}};
}

// ── Standard-Import ────────────────────────────────────────
function parseImportData(workbook){
  var sheets=workbook.SheetNames;
  var firstSheet=XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]],{defval:""});
  firstSheet=remapClearQuestColumns(firstSheet);
  if(isClearQuestFormat(firstSheet))return parseClearQuest(firstSheet);
  function getSheet(name){var f=sheets.find(function(s){return s.toLowerCase().includes(name.toLowerCase());});return f?XLSX.utils.sheet_to_json(workbook.Sheets[f],{defval:""}):[]; }
  var empRows=getSheet("mitarbeiter"),relRows=getSheet("release"),pkgRows=getSheet("arbeitspaket");
  var employees=empRows.filter(function(r){return r["Name"]||r["name"];}).map(function(r){return{id:uid(),name:String(r["Name"]||r["name"]||"").trim(),role:String(r["Rolle"]||r["rolle"]||"").trim(),weeklyHours:Number(r["Wochenstunden"]||r["wochenstunden"]||r["Stunden"]||40)||40};}).filter(function(e){return e.name;});
  var empByName={};employees.forEach(function(e){empByName[e.name.toLowerCase()]=e.id;});
  var releaseMap={};

// Punkt 2: Nur Workitems unter evaluated/committed Issues zählen für Aufwände
function countsForEffort(pkg){
  var il=(pkg&&pkg.issueLcs||"").toLowerCase();
  if(!il)return true; // unbekannt → mitzählen (rückwärtskompatibel mit Demodaten)
  return il==="evaluated"||il==="committed";
}
// Tageslast-Map: MA-ID → Datum → Stunden (genutzt von runAnalysis + KapazitaetView)
// v2.88.3: opts.chargePast belastet auch vergangene Tage (fuer die Anzeige
// im Zeitstrahl). Tagessatz und Auswahl sind in beiden Faellen dieselben.
function buildLoadMap(allPkgs,employees,today,opts){
  var chargePast=!!(opts&&opts.chargePast);
  var loadMap={};employees.forEach(function(e){loadMap[e.id]={};});
  allPkgs.forEach(function(p){
    if(p.lcs==="closed")return;
    var rem=(p.remainingHours!=null&&p.remainingHours>=0)?p.remainingHours:p.hours;
    if(!rem)return;
    // Auslastung über die VOLLE geplante Laufzeit verteilen (nicht nur Resttage).
    // Würde man nur über verbleibende Tage teilen, entstehen bei fast-abgelaufenen
    // Paketen unmögliche Spitzenwerte (z.B. 590% bei 40h Rest auf 1 verbleibenden Tag).
    if(!p.start||!p.end)return;
    if(!countsForEffort(p))return; // Punkt 2: nur evaluated/committed Issues belasten
    var workDays=getDays(p.start,p.end).filter(function(d){return !isWE(d);});
    if(!workDays.length)return;
    var dailyLoad=rem/workDays.length; // h/Tag homogen über gesamte AT
    if(!loadMap[p.employee])loadMap[p.employee]={};
    // Nur noch zukünftige Tage tatsächlich belasten (vergangene gelten als geleistet)
    var chargeDays=chargePast?workDays:workDays.filter(function(d){return dateStr(d)>=today;});
    if(!chargeDays.length)chargeDays=workDays.slice(-1);
    chargeDays.forEach(function(d){var k=dateStr(d);loadMap[p.employee][k]=(loadMap[p.employee][k]||0)+dailyLoad;});
  });
  return loadMap;
}

// v2.88.3: absMapIn ist die vollstaendige Abwesenheitskarte aus Planungstool
// (gemeldete Abwesenheiten + Feiertage + Ausfaelle des aktiven Szenarios).
// Ohne sie wird wie bisher nur aus absences gebaut -- fuer Aufrufer ausserhalb.
function runAnalysis(releases,employees,absences,absMapIn){
  var today=dateStr(new Date());
  var absMap={};
  if(absMapIn){Object.keys(absMapIn).forEach(function(id){absMap[id]=absMapIn[id];});}
  else{(absences||[]).forEach(function(ab){getDays(ab.start,ab.end).forEach(function(d){if(!absMap[ab.employee])absMap[ab.employee]={};absMap[ab.employee][dateStr(d)]=true;});});}
  var allPkgs=releases.flatMap(function(r){var direct=(r.directPackages||[]).map(function(p){return{...p,rn:r.name,cn:"",rc:r.color,fcDueDate:"",bcDueDate:r.dueDate||""};});var inFc=r.components.flatMap(function(c){return c.packages.map(function(p){return{...p,rn:r.name,cn:c.name,rc:r.color,fcDueDate:c.dueDate||"",bcDueDate:r.dueDate||""};});});return direct.concat(inFc);});
  var pkgById={};allPkgs.forEach(function(p){pkgById[p.id]=p;});
  var loadMap=buildLoadMap(allPkgs,employees,today);

  // Topologische Sortierung (Kahn) damit capEnd von Vorgängern zu Nachfolgern propagiert
  var inDeg={},adj={};
  allPkgs.forEach(function(p){inDeg[p.id]=0;adj[p.id]=[];});
  allPkgs.forEach(function(p){(p.dependencies||[]).forEach(function(dId){if(adj[dId])adj[dId].push(p.id);inDeg[p.id]=(inDeg[p.id]||0)+1;});});
  var queue=allPkgs.filter(function(p){return inDeg[p.id]===0;}).map(function(p){return p.id;});
  var topoOrder=[];
  while(queue.length){var cur=queue.shift();topoOrder.push(cur);(adj[cur]||[]).forEach(function(nxt){inDeg[nxt]--;if(inDeg[nxt]===0)queue.push(nxt);});}
  // Pakete die in keinem Zyklus landen, restliche anhängen
  allPkgs.forEach(function(p){if(topoOrder.indexOf(p.id)<0)topoOrder.push(p.id);});

  // capEnd-Map: wird während Analyse befüllt und von Nachfolgern gelesen
  var computedCapEnd={};
  allPkgs.forEach(function(p){computedCapEnd[p.id]=p.end;});

  var resultMap={};

  topoOrder.forEach(function(pkgId){
    var pkg=pkgById[pkgId];if(!pkg)return;
    var emp=employees.find(function(e){return e.id===pkg.employee;});
    var cap=emp?dailyCapacity(emp):8;
    var hpd=emp?(emp.weeklyHours||35)/5:8;
    if(!pkg.start||!pkg.end)return; // Skip WI ohne Datum
    var empAbs=absMap[pkg.employee]||{};
    var rem=(pkg.remainingHours!=null&&pkg.remainingHours>=0)?pkg.remainingHours:pkg.hours;
    var planStart=pkg.start>today?pkg.start:today;
    // Vorgänger: capEnd nutzen (nicht originales end)
    var depMaxEnd=(pkg.dependencies||[]).reduce(function(mx,depId){
      var depCapEnd=computedCapEnd[depId]||"";
      return depCapEnd>mx?depCapEnd:mx;
    },"");
    var depConstrainedStart=depMaxEnd?nextWorkday(depMaxEnd):"";
    var effectiveStart=depConstrainedStart>planStart?depConstrainedStart:planStart;
    var computedEnd=calcEndDate(effectiveStart,rem,empAbs,hpd);
    var pkgDays=getDays(pkg.start,pkg.end).filter(function(d){return !isWE(d)&&!empAbs[dateStr(d)];});
    var hardDays=pkgDays.filter(function(d){return((loadMap[pkg.employee]||{})[dateStr(d)]||0)/cap>REPLAN_THRESHOLD;});
    var softDays=pkgDays.filter(function(d){var u=((loadMap[pkg.employee]||{})[dateStr(d)]||0)/cap;return u>TARGET_UTIL&&u<=REPLAN_THRESHOLD;});
    var maxLoad=0;pkgDays.forEach(function(d){var l=(loadMap[pkg.employee]||{})[dateStr(d)]||0;if(l>maxLoad)maxLoad=l;});
    var capEnd=computedEnd;
    // v2.84.0: EINHEITENFEHLER. totalExcess ist die Summe der ueberzaehligen
    // STUNDEN an den ueberlasteten Tagen. Sie wurde ohne Umrechnung als
    // Anzahl ARBEITSTAGE angehaengt -- ein Tag mit 2,75 h Ueberlast kostete
    // damit vier volle Tage statt eines halben. Weil capEnd eines Vorgaengers
    // der frueheste Start des Nachfolgers ist, wanderte der Fehler die
    // Abhaengigkeitskette entlang und multiplizierte sich; so entstanden
    // Prognosen Monate hinter dem Plan.
    if(hardDays.length>0){
      var totalExcess=hardDays.reduce(function(s,d){
        var load=(loadMap[pkg.employee]||{})[dateStr(d)]||0;
        return s+Math.max(0,load-(cap*TARGET_UTIL));
      },0);
      // Ueberstunden durch Tageskapazitaet = zusaetzlich benoetigte Tage.
      var extraDays=Math.ceil(totalExcess/Math.max(1,cap));
      var nd=new Date(computedEnd),added=0;
      while(added<extraDays){nd.setDate(nd.getDate()+1);if(!isWE(nd))added++;}
      capEnd=dateStr(nd);
    }
    // capEnd für Nachfolger merken
    computedCapEnd[pkgId]=capEnd;
    var endShifted=capEnd<pkg.end,endDelayed=capEnd>pkg.end;
    var indirectlyAffected=allPkgs.filter(function(other){return (other.dependencies||[]).indexOf(pkg.id)>=0&&capEnd>=other.start;}).map(function(o){return o.id;});
    resultMap[pkgId]={pkg:pkg,emp:emp,rem:rem,planStart:effectiveStart,computedEnd:computedEnd,capEnd:capEnd,endShifted:endShifted,endDelayed:endDelayed,daysGained:endShifted?workdaysBetween2(capEnd,pkg.end):0,daysLost:endDelayed?workdaysBetween2(pkg.end,capEnd):0,hardDays:hardDays.length,softDays:softDays.length,maxUtil:Math.round((maxLoad/cap)*100),depConstrainedStart:depConstrainedStart,indirectlyAffected:indirectlyAffected,status:hardDays.length>0?"replan":softDays.length>0?"puffer":"ok"};
  });
  return allPkgs.filter(function(p){return p.lcs!=="closed";}).map(function(p){return resultMap[p.id];}).filter(Boolean);
}

function normalizeToClearQuestTable(rawRows){
  function _get(row,srcList){for(var i=0;i<srcList.length;i++){var v=row[srcList[i]];if(v!==undefined&&v!==null&&String(v).trim()!="")return String(v).trim();}return "";}
  function _pd(s){if(!s)return "";s=String(s).trim();var fmts=[{re:/^(\d{2})\.(\d{2})\.(\d{2})[, ]/,fn:function(m){return "20"+m[3]+"-"+m[2]+"-"+m[1];}},{re:/^(\d{2})\.(\d{2})\.(\d{4})[, ]/,fn:function(m){return m[3]+"-"+m[2]+"-"+m[1];}},{re:/^(\d{2})\.(\d{2})\.(\d{2})$/,fn:function(m){return "20"+m[3]+"-"+m[2]+"-"+m[1];}},{re:/^(\d{2})\.(\d{2})\.(\d{4})$/,fn:function(m){return m[3]+"-"+m[2]+"-"+m[1];}},{re:/^(\d{4})-(\d{2})-(\d{2})/,fn:function(m){return m[1]+"-"+m[2]+"-"+m[3];}}];for(var i=0;i<fmts.length;i++){var m=s.match(fmts[i].re);if(m)return fmts[i].fn(m);}return "";}
  function _cn(s){return s?String(s).trim().replace(/\s*\(.*?\)\s*$/g,"").trim():"";}
  function _cd(s){if(!s)return "";var m=String(s).trim().match(/\(([^)]+)\)\s*$/);return m?m[1].trim():"";}
  function _reff(xml){if(!xml)return null;var m=String(xml).match(/(?<![A-Za-z])R_Eff="([^"]*)"/);if(m&&m[1]){var v=parseFloat(m[1]);if(!isNaN(v)&&v>0)return v;}return null;}
  function _remeff(xml,row){
    var d=parseFloat(row["Tag_Rem_Eff Workitem"]||row["Tag_Rem_Eff"]||row["Rem_Eff Workitem"]||"");
    if(!isNaN(d)&&d>=0)return d;
    if(xml){var m=String(xml).match(/Rem_Eff="([^"]+)"/);if(m&&m[1]){var v=parseFloat(m[1]);if(!isNaN(v)&&v>=0)return v;}
            var m2=String(xml).match(/Tag_Rem_Eff="([^"]+)"/);if(m2&&m2[1]){var v2=parseFloat(m2[1]);if(!isNaN(v2)&&v2>=0)return v2;}}
    return null;}
  return rawRows.map(function(row){
    var n={};
    CQ_MAPPING.forEach(function(m){n[m.field]=_get(row,m.src);});
    ["wi_start","wi_end","bc_deadline","fc_deadline"].forEach(function(f){if(n[f])n[f]=_pd(n[f])||n[f];});
    if(n.wi_assignee){if(!n.wi_abteilung)n.wi_abteilung=_cd(n.wi_assignee);n.wi_assignee=_cn(n.wi_assignee);}
    // Aufwand: R_Eff → EstimationEffort → 8h  (identisch zu parseClearQuest)
    var xml=n._tags_xml||"";
    var rEffH=_reff(xml);
    var estH=parseFloat(n.wi_aufwand_h)||0;
    var hours=rEffH!=null&&rEffH>0?rEffH:(estH>0?estH:8);
    n.wi_aufwand_h=String(hours);
    // Restaufwand: Rem_Eff → wenn leer = Gesamt; closed/canceled = 0
    var lcs=(n.wi_status||"").toLowerCase();
    var remEffH=_remeff(xml,row);
    if(lcs==="closed"||lcs==="canceled"){
      n.wi_rem_h="0";
    } else {
      n.wi_rem_h=String(remEffH!=null&&remEffH>=0?Math.round(remEffH*10)/10:hours);
    }
    // wi_rem_tage entfernen (war alte Tage-Logik, jetzt alles in Stunden)
    delete n.wi_rem_tage;
    return n;
  });
}

// v2.57.0 — ZEITERFASSUNG ("Auftragstracker")
// Umsetzung des Lasten-/Pflichtenhefts v1.5 innerhalb von CAPLAN.
//
// Abbildung der Hierarchie (Kap. 4.1):
//   Auftraggeber  -> bewusst NICHT abgebildet (Entscheidung Maik)
//   Auftrag       -> BC (Release)
//   (Zwischen)    -> FC (Feature Component)
//   Workitem      -> CAPLAN-Workitem aus dem ClearQuest-Import
// Gebucht wird ausschliesslich auf Workitems (Kap. 5, Grundprinzip).
// Der Schluessel ist die WI-ID (CQ-ID); BC/FC/Titel werden als Snapshot
// mitgeschrieben, damit Buchungen einen Re-Import ueberleben (analog zum
// employeeName-Muster bei Abwesenheiten).
//
// NICHT umsetzbar im Browser und daher entfallen:
//   - Systemweite Hotkeys, Taskleisten-Widget (Kap. 5)
//   - GetLastInputInfo, PowerModeChanged/Standby (Kap. 7)
//   - Single-Instance-Mutex, MSIX, SQLite (Kap. 13/16)
// Ersatz: In-App-Shortcuts, Idle-Erkennung ueber DOM-Events, localStorage.
// ══════════════════════════════════════════════════════════════════════
// ── v2.84.0: Belastbares Laden ───────────────────────────────────────
// Gesammelte Befunde des Ladevorgangs. Bewusst ausserhalb von React:
// die Ladefunktionen laufen in useState-Initialisierern, also vor dem
// ersten Rendern, und koennen noch keinen State setzen.
var DATA_ISSUES={repaired:[],fatal:[]};

function isPlainObj(v){return !!v&&typeof v==="object"&&!Array.isArray(v);}

// Rettet eine Liste: gueltige Eintraege behalten, kaputte zaehlen.
// Rueckgabe null bedeutet "gar nicht erst verwertbar" -- der Aufrufer
// entscheidet dann, was zu tun ist.
function safeList(key,label,v,pruefe,heile){
  if(v==null)return null;                       // Schluessel fehlt
  if(!Array.isArray(v)){
    DATA_ISSUES.fatal.push({key:key,label:label,art:typeof v});
    return [];
  }
  var out=[],weg=0;
  v.forEach(function(x){
    if(!pruefe(x)){weg++;return;}
    out.push(heile?heile(x):x);
  });
  if(weg>0)DATA_ISSUES.repaired.push({key:key,label:label,weg:weg,gesamt:v.length});
  return out;
}

// Einfache Zuordnungstabellen (z. B. ausgeblendete Zeilen, Farben).
// Der literale Wert null bestand die bisherige Pruefung, weil lsLoad
// seinen Vorgabewert nur bei FEHLENDEM Schluessel einsetzt.
function safeMap(key,label,v,vorgabe){
  if(v==null)return vorgabe;
  if(!isPlainObj(v)){
    DATA_ISSUES.repaired.push({key:key,label:label,weg:1,gesamt:1});
    return vorgabe;
  }
  return v;
}

function healRelease(r){
  var o=Object.assign({},r);
  if(!Array.isArray(o.components))o.components=[];
  if(!Array.isArray(o.directPackages))o.directPackages=[];
  o.components=o.components.filter(isPlainObj).map(function(c){
    var cc=Object.assign({},c);
    if(!Array.isArray(cc.packages))cc.packages=[];
    cc.packages=cc.packages.filter(isPlainObj);
    return cc;
  });
  o.directPackages=o.directPackages.filter(isPlainObj);
  return o;
}

}

// Kap. 4.3 — Mitternachts-Ueberlauf. Eine Buchung ueber die Tagesgrenze
// wird je Kalendertag aufgeteilt (23:30-23:59:59 an Tag X, 00:00:00-01:15
// an Tag X+1). Die Sekunden werden dabei bis 24:00 gerechnet, damit die
// Summe exakt bleibt.
function splitAcrossMidnight(startMs,endMs){
  var out=[],cur=startMs;
  if(!(endMs>startMs))return [{date:tsDate(startMs),start:tsTime(startMs),end:tsTime(startMs),seconds:0}];
  var guard=0;
  while(cur<endMs&&guard++<400){
    var d=new Date(cur);
    var dayEnd=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1,0,0,0,0).getTime();
    var seg=Math.min(dayEnd,endMs);
    out.push({
      date:tsDate(cur),
      start:tsTime(cur),
      end:(seg===dayEnd?"23:59:59":tsTime(seg)),
      seconds:Math.max(0,Math.round((seg-cur)/1000))
    });
    cur=seg;
  }
  return out;
}

// v2.58.0: Monatshelfer. Bewusst ueber lokale Datumskomponenten, damit die
// Monatsgrenzen nicht durch UTC-Versatz verrutschen (v2.37.0-Lehre).
function monthBounds(ym){
  var y=parseInt(String(ym).slice(0,4),10),m=parseInt(String(ym).slice(5,7),10)-1;
  return {y:y,m:m,first:new Date(y,m,1),last:new Date(y,m+1,0)};
}
function shiftMonth(ym,delta){
  var b=monthBounds(ym),d=new Date(b.y,b.m+delta,1);

// Arbeitstage (Mo–Fr) zwischen zwei Datumsstrings, beide Grenzen inklusive.
// Bewusst lokal geparst ("T00:00:00"), damit kein UTC-Versatz entsteht.
function wdCountLocal(fromStr,toStr){
  if(!fromStr||!toStr||fromStr>toStr)return 0;
  var d=new Date(fromStr+"T00:00:00"),e=new Date(toStr+"T00:00:00"),n=0,g=0;
  if(isNaN(d.getTime())||isNaN(e.getTime()))return 0;
  while(d<=e&&g++<4000){if(!isWE(d))n++;d.setDate(d.getDate()+1);}
  return n;
}

function currentMonth(){var d=new Date();return d.getFullYear()+"-"+tPad2(d.getMonth()+1);}
function monthLabel(ym){
  var b=monthBounds(ym);
  try{return b.first.toLocaleDateString("de-DE",{month:"long",year:"numeric"});}
  catch(e){return ym;}
}

function roundSeconds(sec,mode){
  var def=TIME_ROUNDINGS[0];
  var r=(TIME_ROUNDINGS.filter(function(x){return x.key===mode;})[0]||def).sec;
  if(!r)return Math.round(sec||0);
  return Math.round((sec||0)/r)*r;
}

// Sekunden eines aktiven Timers (Segmentmodell: Pausen = mehrere Segmente).
function activeElapsed(act,nowMs){
  if(!act||!act.segments)return 0;
  var now=nowMs||Date.now(),sum=0;
  act.segments.forEach(function(sg){sum+=Math.max(0,((sg.to==null?now:sg.to)-sg.from)/1000);});
  return Math.round(sum);
}
function activeIsPaused(act){
  if(!act||!act.segments||!act.segments.length)return false;
  return act.segments[act.segments.length-1].to!=null;
}

// Live-Anzeige als eigene Top-Level-Komponente: der 1s-Takt loest damit
// NUR hier ein Re-Render aus und nicht im gesamten App-Baum.
function LiveTimer(p){
  var s_t=useState(0);
  useEffect(function(){
    if(!p.running)return;
    var iv=setInterval(function(){s_t[1](function(v){return v+1;});},1000);
    return function(){clearInterval(iv);};

// ── v2.84.0: BC/FC aus dem angezeigten Titel entfernen ───────────────
// BC und FC stehen kleingedruckt unter dem Workitem. Wiederholt der Titel
// sie, steht dieselbe Angabe zweimal da und frisst die knappe Breite.
// Reine Anzeige -- gespeichert, exportiert und gesucht wird der Originaltitel.
var WI_SEP = "\\s\\-\\u2013\\u2014:/_|\\[\\](){}";
function wiLabel(title,bc,fc){
  var t=String(title||"").trim();
  if(!t)return t;
  var cand=[];
  [fc,bc].forEach(function(p){
    var v=String(p||"").trim();
    if(v.length<3)return;               // zu kurz: zu leicht zufaellig getroffen
    cand.push(v);
    // ClearQuest schreibt Bereiche gern als "BC : Name" oder "FC : Name"
    var m=v.match(/^(?:BC|FC)\s*:\s*(.+)$/i);
    if(m&&m[1].trim().length>=3)cand.push(m[1].trim());
  });
  var out=t;
  cand.forEach(function(v){
    var esc=v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    // Nur als ganzes Stueck: an einem Trenner oder am Rand beginnend UND endend.
    var re=new RegExp("(^|["+WI_SEP+"])"+esc+"(?=$|["+WI_SEP+"])","gi");
    out=out.replace(re,function(_m,vor){return vor;});
  });
  out=out.replace(/\s+/g," ")
         .replace(new RegExp("^["+WI_SEP+"]+"),"")
         .replace(new RegExp("["+WI_SEP+"]+$"),"")
         .replace(/([\-\u2013\u2014:/_|])\s*\1+/g,"$1")
         .trim();
  // Bleibt zu wenig uebrig, ist der Originaltitel die bessere Auskunft.
  return out.length>=3?out:t;
}

// v2.84.0: Startet ein Workitem heute, ist es die wahrscheinlichste
// Antwort auf "worauf buche ich jetzt". Ohne Suchbegriff standen dort

function startsToday(w){
  if(!w||!w.start)return false;
  var d=new Date();
  var t=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return String(w.start).slice(0,10)===t;

function tFilterWis(list,q){

  // Nur ohne Suchbegriff umsortieren. Wer tippt, sucht etwas Bestimmtes
  // und will die Treffer nicht nach einem fremden Kriterium verschoben.
  if(!str){
    var heute=[],rest=[];
    (list||[]).forEach(function(w){(startsToday(w)?heute:rest).push(w);});
    return heute.concat(rest).slice(0,12);

  var toks=str.split(/\s+/);
  return list.filter(function(w){
    var hay=(String(w.id)+" "+w.title+" "+w.bc+" "+w.fc).toLowerCase();
    for(var i=0;i<toks.length;i++){if(hay.indexOf(toks[i])<0)return false;}
    return true;
  }).slice(0,12);
}

  function lsPersist(key,val){

          if(!relOk)saveOne("ptool_releases",s.releases);

  function bcDelays(rels){

  // ── Simulierte Releases: Kapazitätsbewusster Scheduler ────
  // Jeder Mitarbeiter wird mit einem Buchungskalender (Set) verwaltet.

  // Topologische Reihenfolge stellt sicher dass Abhängigkeiten eingehalten werden.
  // ── SWE-Phase aus WI-Titel extrahieren ──────────────────────────────
  function getSwePhase(title){
    var m=String(title||"").match(/SWE(\d)/i);
    return m?parseInt(m[1]):null;
  }

  // ── Umbuchungs-Algorithmus für eine einzelne BC ──────────────────────
  // v2.72.0: Die Abwesenheitskarte wird uebergeben statt aus dem Scope gelesen.
  // Nur so kann die Szenarien-Ansicht alle Szenarien durchrechnen, ohne sie
  // nacheinander zu aktivieren.
  function computeUmbuchung(bcRelease,absMapOverride){
    var _absMap=absMapOverride||absenceMap;
    var today=dateStr(new Date());
    var bcDue=bcRelease.dueDate||"";
    var empBooked={};
    employees.forEach(function(e){empBooked[e.id]=new Set();});
    // P1: wid→issueId Map einmalig (statt rawData.find pro WI)
    var widToIssue={};
    if(rawData&&rawData.length){rawData.forEach(function(rd){if(rd.wi_id)widToIssue[rd.wi_id]=rd.iss_id||null;});}

    // Plane rem Stunden ab fromDate für empId (überspringt WE + Abwesenheit + bereits gebucht)
    function scheduleAndBook(empId,fromDate,rem){
      var hpd=(employees.find(function(e){return e.id===empId;})||{weeklyHours:35}).weeklyHours/5||7;
      var absMap=_absMap[empId]||{};
      if(!empBooked[empId])empBooked[empId]=new Set();
      var hoursLeft=rem,startDate=null,endDate=null;
      var cur=new Date(fromDate||dateStr(new Date()));
      if(isNaN(cur.getTime()))cur=new Date();
      var limit=new Date(cur);limit.setFullYear(limit.getFullYear()+3);
      while(hoursLeft>0&&cur<=limit){
        var k=dateStr(cur);
        if(!isWE(cur)&&!absMap[k]&&!empBooked[empId].has(k)){
          if(startDate===null)startDate=k;
          endDate=k;
          empBooked[empId].add(k);
          hoursLeft-=hpd;
        }
        cur.setDate(cur.getDate()+1);
      }
      return{start:startDate||fromDate,end:endDate||fromDate};
    }

    // Alle WI der BC flach sammeln
    var allWi=(bcRelease.directPackages||[]).map(function(p){return{...p,_cId:null};})
      .concat(bcRelease.components.flatMap(function(c){
        return c.packages.map(function(p){return{...p,_cId:c.id};});
      }));

    // Gruppiere nach SWE-Phase: {1:[wis], 2:[wis], ..., null:[wis]}
    var byPhase={};
    allWi.forEach(function(p){
      if(p.lcs==="closed")return;
      if(!countsForEffort(p))return; // Punkt 2
      var ph=getSwePhase(p.title);
      var key=ph===null?"x":String(ph);
      if(!byPhase[key])byPhase[key]=[];
      byPhase[key].push(p);
    });

    var scheduled={};
    // phaseEndByIssue[issueId][phase] = letztes Ende aller WI dieser Phase für dieses Issue
    var phaseEndByIssue={};

    // Hilfsfunktion: frühester Starttermin für ein WI basierend auf Vorphase des gleichen Issues
    function getPhaseStart(pkg,phase){
      // Issue-ID aus rawData ermitteln
      var issueId=widToIssue[pkg.id]||null;
      if(!issueId||phase<=1)return today;
      var prevPhaseEnd=(phaseEndByIssue[issueId]&&phaseEndByIssue[issueId][phase-1])||"";
      // Gleiches Datum erlaubt (>=, nicht >)
      return prevPhaseEnd||today;
    }

    function recordPhaseEnd(pkg,phase,endDate){
      var issueId=widToIssue[pkg.id]||null;
      if(!issueId)return;
      if(!phaseEndByIssue[issueId])phaseEndByIssue[issueId]={};
      var cur=phaseEndByIssue[issueId][phase]||"";
      if(endDate>cur)phaseEndByIssue[issueId][phase]=endDate;
    }

    // SWE-Phasen 1-6 der Reihe nach, dann nicht-SWE (x) parallel
    var phaseOrder=["1","2","3","4","5","6","x"];
    phaseOrder.forEach(function(phKey){
      var wis=byPhase[phKey]||[];
      var phase=phKey==="x"?null:parseInt(phKey);
      wis.forEach(function(pkg){
        var rem=(pkg.remainingHours!=null&&pkg.remainingHours>=0)?pkg.remainingHours:pkg.hours;
        if(rem<=0){scheduled[pkg.id]={start:pkg.start,end:pkg.end};return;}
        var phStart=phase?getPhaseStart(pkg,phase):today;
        // Frühester Start = max(heute, phaseStart, letztes Ende dieses MA in dieser BC)
        var empLast=(empBooked[pkg.employee]&&empBooked[pkg.employee].size>0)
          ?Array.from(empBooked[pkg.employee]).sort().pop():""
        var earliest=today;
        if(phStart>earliest)earliest=phStart;
        // empLast ist letzter gebuchter Tag → nächster AT danach
        if(empLast){var nl=new Date(empLast);nl.setDate(nl.getDate()+1);var ns=dateStr(nl);if(ns>earliest)earliest=ns;}
        var result=scheduleAndBook(pkg.employee,earliest,rem);
        scheduled[pkg.id]={start:result.start,end:result.end};
        if(phase)recordPhaseEnd(pkg,phase,result.end);
      });
    });

    // Deadline-Check
    var lateCount=0;
    if(bcDue){
      Object.values(scheduled).forEach(function(s){if(s.end>bcDue)lateCount++;});
    }

    return{scheduled:scheduled,lateCount:lateCount};
  }

  // Vorher zeigte nur simMode den Banner -- ein aktiver Umbuchen-Toggle verschob

      }).map(function(p){return{...p,releaseId:r.id,componentId:null,rc:getBcColor(r),rn:r.name,cn:"",fcDueDate:"",bcDueDate:r.dueDate||""};});

  var pkgById=useMemo(function(){var m={};allPkgs.forEach(function(p){m[p.id]=p;});return m;},[allPkgs]);
  // ── v2.86.0: Konflikt-Kaskaden ──────────────────────────────────────
  // Liegt bewusst auf Planungstool-Ebene (nicht in der View) -- vgl. den

  var analysisById=useMemo(function(){var m={};analysis.forEach(function(r){m[r.pkg.id]=r;});return m;},[analysis]);
  // Kanten aus DERSELBEN Quelle wie analysis. Der erste Entwurf baute sie aus

  var conflictSucc=useMemo(function(){
